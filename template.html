<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UFC Fight Cards</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--red:#e8192c;--gold:#c9a84c;--bg:#0d0d0d;--card:#161616;--card2:#1e1e1e;--border:rgba(255,255,255,.08);--border2:rgba(255,255,255,.15);--text:#f0f0f0;--muted:#777;--muted2:#aaa}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;padding-bottom:48px;font-size:15px}
.hdr{display:flex;align-items:center;justify-content:space-between;padding:0 16px;height:52px;border-bottom:1px solid var(--border);background:rgba(13,13,13,.97);backdrop-filter:blur(8px);position:sticky;top:0;z-index:9}
.logo{display:flex;align-items:center;gap:8px}
.logo-hex{width:28px;height:28px;background:var(--red);clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:10px;color:#fff;flex-shrink:0}
.logo-text{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:.08em}
.logo-text span{color:var(--red)}
.hdr-right{display:flex;align-items:center;gap:10px}
.updated-lbl{font-size:10px;color:var(--muted);letter-spacing:.04em}
.btn-ufc{background:var(--red);border:none;color:#fff;padding:6px 12px;border-radius:6px;font:600 12px 'DM Sans',sans-serif;cursor:pointer;text-decoration:none;display:flex;align-items:center;gap:4px}
.btn-ufc:hover{background:#c9101f}
.hero{padding:20px 16px 16px;border-bottom:1px solid var(--border)}
.hero h1{font-family:'Bebas Neue',sans-serif;font-size:34px;letter-spacing:.07em;line-height:1}
.hero h1 span{color:var(--red)}
.hero-sub{font-size:11px;color:var(--muted);margin-top:5px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);background:var(--card);border-bottom:1px solid var(--border)}
.stat{padding:11px 6px;text-align:center;border-right:1px solid var(--border)}
.stat:last-child{border-right:none}
.sv{font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:.05em;line-height:1}
.sl{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-top:2px}
.content{padding:14px 12px}
.sec-lbl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.sec-lbl::after{content:'';flex:1;height:1px;background:var(--border)}
.evcard{background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:8px;animation:up .3s ease both}
.evcard.featured{border-color:var(--red)}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.evcard:nth-child(2){animation-delay:.06s}.evcard:nth-child(3){animation-delay:.12s}.evcard:nth-child(4){animation-delay:.18s}
.ev-hdr{padding:11px 13px 10px;border-bottom:1px solid var(--border)}
.ev-name{font-family:'Bebas Neue',sans-serif;font-size:17px;letter-spacing:.06em;line-height:1;margin-bottom:6px}
.ev-meta{display:flex;flex-wrap:wrap;gap:4px 14px}
.ev-detail{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:3px}
.ev-detail svg{width:10px;height:10px;opacity:.45;flex-shrink:0}
.badges{display:flex;gap:4px;margin-top:7px;flex-wrap:wrap}
.badge{font-size:9px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:2px 6px;border-radius:3px}
.b-next{background:rgba(232,25,44,.12);color:var(--red);border:1px solid rgba(232,25,44,.25)}
.b-title{background:rgba(201,168,76,.1);color:var(--gold);border:1px solid rgba(201,168,76,.2)}
.b-ppv{background:rgba(255,255,255,.05);color:var(--muted);border:1px solid var(--border)}
.fight{padding:11px 13px;border-bottom:1px solid var(--border)}
.fight:last-of-type{border-bottom:none}
.flbl{font-size:9px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px}
.flbl.main{color:var(--red)}.flbl.co{color:var(--gold)}.flbl.pre{color:var(--muted)}
.mu{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px}
.ft{display:flex;flex-direction:column;gap:1px;min-width:0}
.ft.r{align-items:flex-end;text-align:right}
.fn{font-family:'Bebas Neue',sans-serif;font-size:19px;letter-spacing:.03em;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fn.sm{font-size:15px}.fn.xs{font-size:13px;font-family:'DM Sans',sans-serif;font-weight:500}
.frec{font-size:11px;color:var(--muted2);margin-top:1px}
.fpills{display:flex;gap:3px;flex-wrap:wrap;margin-top:2px}
.ft.r .fpills{justify-content:flex-end}
.pchamp{font-size:9px;font-weight:600;padding:1px 5px;border-radius:2px;background:rgba(201,168,76,.1);color:var(--gold);border:1px solid rgba(201,168,76,.18);letter-spacing:.06em}
.prank{font-size:9px;font-weight:600;padding:1px 5px;border-radius:2px;background:rgba(255,255,255,.06);color:var(--muted2);letter-spacing:.05em}
.vc{display:flex;flex-direction:column;align-items:center;gap:2px;flex-shrink:0}
.vs{font-family:'Bebas Neue',sans-serif;font-size:13px;color:rgba(255,255,255,.16);letter-spacing:.08em}
.wc-lbl{font-size:9px;color:var(--muted);text-align:center;text-transform:uppercase;letter-spacing:.04em;line-height:1.3;max-width:56px}
.pbtn{width:100%;background:none;border:none;border-top:1px solid var(--border);padding:9px 13px;display:flex;align-items:center;gap:6px;font-size:10px;color:var(--muted);cursor:pointer;font-family:'DM Sans',sans-serif;letter-spacing:.06em;text-transform:uppercase;transition:color .15s,background .15s;text-align:left}
.pbtn:hover{color:var(--muted2);background:rgba(255,255,255,.02)}
.pbtn svg{width:12px;height:12px;transition:transform .2s;margin-left:auto;flex-shrink:0}
.pbtn.open svg{transform:rotate(180deg)}
.pbody{display:none;border-top:1px solid var(--border)}.pbody.open{display:block}
@media(min-width:420px){.content{padding:16px}.fn{font-size:21px}.fn.sm{font-size:17px}.hero h1{font-size:40px}}
@media(min-width:640px){.hdr{padding:0 20px}.hero{padding:24px 20px 18px}.content{padding:20px}}
</style>
</head>
<body>

<header class="hdr">
  <div class="logo">
    <div class="logo-hex">UFC</div>
    <span class="logo-text">FIGHT <span>CARDS</span></span>
  </div>
  <div class="hdr-right">
    <span class="updated-lbl">Updated {{UPDATED}}</span>
    <a class="btn-ufc" href="https://www.ufc.com/events" target="_blank">
      <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
      UFC.com
    </a>
  </div>
</header>

<section class="hero">
  <h1>UPCOMING<br><span>FIGHT CARDS</span></h1>
  <p class="hero-sub">Auto-updated weekly · {{UPDATED}}</p>
</section>

<div class="stats" id="stats"></div>
<main class="content" id="app"></main>

<script>
var EVENTS = [];

function daysOut(d) { return Math.ceil((new Date(d) - Date.now()) / 864e5); }
function fmtDate(d) { return new Date(d).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',year:'numeric'}); }

function fighterHTML(f, right, size) {
  if (!f) return '<div class="ft"></div>';
  var r = right ? 'r' : '';
  var sz = size === 'sm' ? 'sm' : size === 'xs' ? 'xs' : '';
  var champ = f.ranking === 'C';
  var rank = (!champ && f.ranking) ? f.ranking : null;
  var pill = champ
    ? '<div class="fpills"><span class="pchamp">CHAMP</span></div>'
    : (rank ? '<div class="fpills"><span class="prank">' + rank + '</span></div>' : '');
  return '<div class="ft ' + r + '">'
    + '<div class="fn ' + sz + '">' + (f.name || 'TBD') + '</div>'
    + (f.record ? '<div class="frec">' + f.record + '</div>' : '')
    + pill
    + '</div>';
}

function tp(id, btn) {
  document.getElementById(id).classList.toggle('open');
  btn.classList.toggle('open');
}

var calSVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>';
var pinSVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>';
var tvSVG  = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="15" rx="2"/><polyline points="17 2 12 7 7 2"/></svg>';
var clkSVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>';
var chevSVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>';

function renderEvent(ev, idx) {
  var isFeat  = idx === 0;
  var du      = daysOut(ev.date);
  var duLabel = du === 0 ? 'Tonight' : du === 1 ? 'Tomorrow' : du > 0 ? 'In ' + du + ' days' : 'Completed';
  var titleCount = ev.fights.filter(function(f){ return f.titleFight; }).length;
  var hasTitle = titleCount > 0;
  var isPPV   = /ufc \d/i.test(ev.name);

  var mainFight = ev.fights[0];
  var coFight   = ev.fights[1];
  var mainCard  = ev.fights.slice(2).filter(function(f){ return f.label === 'Main Card'; });
  var prelims   = ev.fights.filter(function(f){ return f.label === 'Prelim' || f.label === 'Early Prelim'; });
  var pid = 'p' + idx;
  var totalExtra = mainCard.length + prelims.length;

  var titleBadge = '';
  if (hasTitle) {
    var titleText = titleCount > 1 ? titleCount + ' Title Fights' : 'Title Fight';
    titleBadge = '<span class="badge b-title">' + titleText + '</span>';
  }

  var mainCardHTML = mainCard.map(function(f) {
    return '<div class="fight">'
      + '<div class="flbl pre">' + f.weightClass + '</div>'
      + '<div class="mu">' + fighterHTML(f.fighter1, false, 'sm') + '<div class="vc"><span class="vs">VS</span></div>' + fighterHTML(f.fighter2, true, 'sm') + '</div>'
      + '</div>';
  }).join('');

  var prelimHTML = prelims.map(function(f) {
    var lbl = f.label === 'Early Prelim' ? 'Early · ' + f.weightClass : f.weightClass;
    return '<div class="fight">'
      + '<div class="flbl pre">' + lbl + '</div>'
      + '<div class="mu">' + fighterHTML(f.fighter1, false, 'xs') + '<div class="vc"><span class="vs">VS</span></div>' + fighterHTML(f.fighter2, true, 'xs') + '</div>'
      + '</div>';
  }).join('');

  return '<div class="evcard' + (isFeat ? ' featured' : '') + '">'
    + '<div class="ev-hdr">'
    +   '<div class="ev-name">' + ev.name + '</div>'
    +   '<div class="ev-meta">'
    +     '<span class="ev-detail">' + calSVG + fmtDate(ev.date) + ' · ' + duLabel + '</span>'
    +     '<span class="ev-detail">' + pinSVG + ev.venue + ', ' + ev.location + '</span>'
    +     '<span class="ev-detail">' + tvSVG + ev.broadcast + '</span>'
    +     '<span class="ev-detail">' + clkSVG + 'Main card ' + ev.mainCardTime + '</span>'
    +   '</div>'
    +   '<div class="badges">'
    +     (isFeat ? '<span class="badge b-next">Next Up</span>' : '')
    +     titleBadge
    +     (isPPV ? '<span class="badge b-ppv">PPV</span>' : '')
    +   '</div>'
    + '</div>'
    + '<div class="fight">'
    +   '<div class="flbl main">Main Event · ' + mainFight.weightClass + (mainFight.titleFight ? ' · Title' : '') + '</div>'
    +   '<div class="mu">' + fighterHTML(mainFight.fighter1, false, 'lg') + '<div class="vc"><span class="vs">VS</span><span class="wc-lbl">' + mainFight.weightClass + '</span></div>' + fighterHTML(mainFight.fighter2, true, 'lg') + '</div>'
    + '</div>'
    + '<div class="fight">'
    +   '<div class="flbl co">Co-Main · ' + coFight.weightClass + (coFight.titleFight ? ' · Title' : '') + '</div>'
    +   '<div class="mu">' + fighterHTML(coFight.fighter1, false, 'sm') + '<div class="vc"><span class="vs">VS</span></div>' + fighterHTML(coFight.fighter2, true, 'sm') + '</div>'
    + '</div>'
    + (totalExtra
      ? '<button class="pbtn" onclick="tp(\"' + pid + '\",this)">' + chevSVG + totalExtra + ' more fight' + (totalExtra !== 1 ? 's' : '') + '</button>'
        + '<div class="pbody" id="' + pid + '">' + mainCardHTML + prelimHTML + '</div>'
      : '')
    + '</div>';
}

function render() {
  var now    = Date.now();
  var events = EVENTS.filter(function(e){ return new Date(e.date) >= now - 864e5 && new Date(e.date) <= now + 864e5 * 65; });

  if (!events.length) {
    document.getElementById('app').innerHTML = '<p style="color:var(--muted);padding:24px 0;text-align:center">No upcoming events in the next 65 days.</p>';
    return;
  }

  var titles = events.reduce(function(n, e) {
    return n + e.fights.filter(function(f){ return f.titleFight; }).length;
  }, 0);
  var bouts = events.reduce(function(n, e){ return n + e.fights.length; }, 0);
  var du    = daysOut(events[0].date);
  var duT   = du === 0 ? 'Now' : du === 1 ? '1d' : du + 'd';

  document.getElementById('stats').innerHTML =
    '<div class="stat"><div class="sv">' + events.length + '</div><div class="sl">Events</div></div>'
    + '<div class="stat"><div class="sv">' + titles + '</div><div class="sl">Titles</div></div>'
    + '<div class="stat"><div class="sv">' + bouts + '</div><div class="sl">Bouts</div></div>'
    + '<div class="stat"><div class="sv">' + duT + '</div><div class="sl">Days Out</div></div>';

  document.getElementById('app').innerHTML =
    '<div class="sec-lbl">Upcoming Events</div>'
    + events.map(function(e, i){ return renderEvent(e, i); }).join('');
}

render();
</script>
</body>
</html>
