<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Picked Fight</title>
<style>
  :root { --bg: #0e0f12; --text: #f2f3f5; --muted: #9aa0aa; --accent: #e8322e; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 24px 16px; box-sizing: border-box; text-align: center; }
  h1 { font-size: 22px; margin: 0 0 8px; letter-spacing: .04em; }
  p { color: var(--muted); margin: 0 0 24px; max-width: 320px; }
  button { background: var(--accent); color: #fff; border: 0; border-radius: 10px; padding: 12px 28px;
    font: inherit; font-weight: 600; }
</style>
</head>
<body>
<main>
  <h1>PICKED FIGHT</h1>
  <p>Can't reach the fight cards right now. Check your connection and try again.</p>
  <button type="button" onclick="location.href='https://andyrbrett.github.io/ufc-dashboard/'">Try again</button>
</main>
</body>
</html>
