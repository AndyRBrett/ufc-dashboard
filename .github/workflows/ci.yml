name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4 pytest
      - name: Syntax check
        run: python -m py_compile scrape.py make_icons.py health.py write_status.py odds_series.py
      - name: Unit tests
        run: python -m pytest -q

  # Frontend + edge-function validation (boot smoke test, syntax, data shape).
  # Same job pages.yml gates its deploy on, so CI shows the exact check that
  # would block a broken release.
  web:
    uses: ./.github/workflows/validate-web.yml
