name: Diagnose Wikipedia Access

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - name: Dump raw Wikipedia wikitext
        run: |
          python3 << 'PYEOF'
          import requests, json

          AGENT = "UFC-Dashboard/1.0 (https://github.com/AndyRBrett/ufc-dashboard; andyrbrett@gmail.com)"

          r = requests.get(
              "https://en.wikipedia.org/w/api.php",
              params={"action":"parse","page":"UFC_328","prop":"wikitext","format":"json"},
              headers={"User-Agent": AGENT},
              timeout=15
          )
          print("Status:", r.status_code)
          wt = r.json().get("parse",{}).get("wikitext",{}).get("*","")
          print("Length:", len(wt))

          # Write full wikitext to file for artifact
          with open("wikitext_dump.txt", "w", encoding="utf-8") as f:
              f.write(wt)

          # Print the results section only
          # Find anything that looks like fight results
          import re
          for keyword in ["fight results", "wikitable", "def.", "Decision", "TKO", "Submission"]:
              idx = wt.find(keyword)
              if idx > -1:
                  print(f"\nFound '{keyword}' at pos {idx}:")
                  print(repr(wt[max(0,idx-100):idx+400]))
                  break
          PYEOF
      - name: Upload wikitext dump
        uses: actions/upload-artifact@v4
        with:
          name: wikitext-dump
          path: wikitext_dump.txt
