name: Diagnose Wikipedia Access

on:
  workflow_dispatch:
    inputs:
      pages:
        description: "Comma-separated article titles to dump (default UFC_328)"
        required: false
        default: "UFC_328"

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r requirements.txt
      - name: Dump raw Wikipedia wikitext
        env:
          PAGES: ${{ inputs.pages }}
        run: |
          python3 << 'PYEOF'
          import requests, json

          AGENT = "UFC-Dashboard/1.0 (https://github.com/AndyRBrett/ufc-dashboard; andyrbrett@gmail.com)"

          import os, re
          pages = [p.strip() for p in (os.environ.get("PAGES") or "UFC_328").split(",") if p.strip()]
          with open("wikitext_dump.txt", "w", encoding="utf-8") as f:
              for page in pages:
                  r = requests.get(
                      "https://en.wikipedia.org/w/api.php",
                      params={"action":"parse","page":page,"prop":"wikitext","format":"json"},
                      headers={"User-Agent": AGENT},
                      timeout=15
                  )
                  wt = r.json().get("parse",{}).get("wikitext",{}).get("*","")
                  print(f"===== {page}: status {r.status_code}, length {len(wt)} =====")
                  print(wt)
                  f.write(f"===== {page} =====\n{wt}\n")
          PYEOF
      - name: Upload wikitext dump
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wikitext-dump
          path: wikitext_dump.txt
