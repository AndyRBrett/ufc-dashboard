# Reusable validation for the browser-facing app + edge functions.
#
# Called by ci.yml (every push / PR, for a visible status) and — crucially — by
# pages.yml as a `needs:` gate so a build that fails to boot can NEVER reach
# production. This is the guard that was missing when a broken edit white-paged
# the app mid-card.
#
#   check:web       — inline <script> + sw.js + data.js compile; EVENTS is usable
#   check:functions — every Supabase edge function parses (incl. the paid one)
#   smoke           — the app actually boots headlessly and the leaderboard opens
#   check:tap       — a tapped push notification actually surfaces its message
#   check:audience  — trash talk reaches exactly the people it was aimed at
#   check:prompt    — a user-supplied roast angle still outranks the other prompt rules
#   check:provider  — the roast runs unfiltered on Grok; analysis stays on Claude
#   check:dedup     — all three result senders derive the same push dedup key
#   check:intel     — a curated fight-week link never lands under the wrong card
#   check:whatsnew  — the what's-new popup never loses a backfill or grows unbounded
#   check:kick      — the scraper still gets dispatched on a card day and in fight week
#   check:recap     — the post-card recap scores the night the way the board and belt do
#   check:wrapped   — Year Wrapped reports the year the way the board and belt scored it
#   check:locks     — a 🔒 lock scores the same on the board, belt and challenges; ≤2 per card
#   check:lab       — the Fight Lab scores exactly like the board, never leaks a result, and boots
#   check:fightbot  — the FightBot MCP server speaks clean JSON-RPC and answers with the board's numbers
#   check:brief     — the Friday Fight Week Brief push goes out once, Friday 7pm ET, linking to the Lab
#   check:swap      — a bout pulled from a card alerts exactly the people who picked it, once, before it locks
#   check:iq        — the AI Fight IQ write-up never states a number it wasn't given, stays on Claude, is capped
#   check:guide     — FightBot's app guide matches scoring.js and the app's real buttons, stays on Claude, is bounded
#   check:verdict   — FightBot's call on a tape/report states no number it wasn't given; the tape poster draws and shares
#   check:parity    — board, belt, recaps and Wrapped are byte-identical to the pre-migration golden
#   check:rooms     — a room's board is the main board filtered; only email accounts join; invites work
#   check:promotion — every UFC picks query is scoped to promotion=eq.ufc (other sports never reach the UFC board)
#   check:sports    — the sport switcher: hidden with nothing to pick, PFL picks tagged pfl, its own board and locks
#   check:bundle    — send-reminders' bundled Lab code matches lab/, scoring.js and index.html
#   check:photos    — a fighter's photo is found once, is never someone else's face, and a miss is retried
#   check:safety    — report / block hold in the database and the app, and the privacy policy is linked
#   check:delete    — Delete my account deletes the login and every row of the caller's, and nobody else's
#   check:migrations — the database rebuilds from supabase/migrations (0000 up) and matches production's core schema
#   check:picklock  — the database refuses a pick, change or delete once its bout's segment has started
name: Validate Web

on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to validate. Empty = the SHA that triggered the run (correct for CI/PRs). pages.yml passes 'main' so it validates the exact tip it ships, including data auto-pushed just before deploy."
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: Static checks (lint + syntax + data + functions)
        run: |
          npm run lint
          npm run check:web
          npm run check:functions
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Boot smoke test
        run: npm run smoke
      - name: Notification tap test
        run: npm run check:tap
      - name: Trash-talk routing test
        run: npm run check:audience
      - name: Trash-talk prompt test
        run: npm run check:prompt
      - name: Trash-talk model routing test
        run: npm run check:provider
      - name: Result-push dedup key test
        run: npm run check:dedup
      - name: Fight model test
        run: npm run check:model
      - name: Parlay calculator test
        run: npm run check:parlay
      - name: Fight Week Intel attribution test
        run: npm run check:intel
      - name: What's New popup test
        run: npm run check:whatsnew
      # These four were in `verify` but missing here, so nothing in CI ran them
      # and a break in any of them could deploy.
      - name: Fighter rename test
        run: npm run check:names
      - name: Notification prefs restore test
        run: npm run check:prefs
      - name: Pick lock times test
        run: npm run check:lock
      - name: Push sender authorization test
        run: npm run check:pushauth
      - name: Pick restore test
        run: npm run check:picks
      - name: kick-scraper cadence gate test
        run: npm run check:kick
      - name: Card recap test
        run: npm run check:recap
      - name: Year Wrapped test
        run: npm run check:wrapped
      - name: Lock scoring test
        run: npm run check:locks
      - name: Fight Lab test
        run: npm run check:lab
      - name: AI historical fight questions
        run: npm run check:history
      - name: FightBot MCP server test
        run: npm run check:fightbot
      - name: Friday brief push test
        run: npm run check:brief
      - name: Replaced-bout alert test
        run: npm run check:swap
      - name: Fight IQ write-up test
        run: npm run check:iq
      - name: FightBot app guide test
        run: npm run check:guide
      - name: FightBot's call and tape poster test
        run: npm run check:verdict
      - name: Scoring parity (engine migration)
        run: npm run check:parity
      - name: Watch Party rooms
        run: npm run check:rooms
      - name: Picks scoped by promotion
        run: npm run check:promotion
      - name: Sport switcher
        run: npm run check:sports
      - name: Edge-function Lab bundle is fresh
        run: npm run check:bundle
      - name: Server-side pick lock
        run: npm run check:picklock
      - name: No outside text reaches the page as HTML
        run: npm run check:html
      - name: Fighter photos
        run: npm run check:photos
      - name: Report, block and privacy policy
        run: npm run check:safety
      - name: Delete my account deletes the account
        run: npm run check:delete
      - name: Database rebuild test
        run: npm run check:migrations
