name: Deploy Supabase Functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
  workflow_dispatch:

jobs:
  # Gate: every edge function must parse before any of them deploy. Catches a
  # typo in the paid ai-breakdown function before it reaches production, with a
  # precise error instead of an opaque `supabase deploy` failure.
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: Syntax-check edge functions
        run: npm run check:functions

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1
        with:
          version: latest
      - name: Deploy send-push
        run: supabase functions deploy send-push --project-ref gkccophrdqtqcowmblre
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - name: Deploy ai-breakdown
        run: supabase functions deploy ai-breakdown --project-ref gkccophrdqtqcowmblre
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - name: Deploy check-results
        run: supabase functions deploy check-results --no-verify-jwt --project-ref gkccophrdqtqcowmblre
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - name: Deploy send-reminders
        run: supabase functions deploy send-reminders --no-verify-jwt --project-ref gkccophrdqtqcowmblre
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - name: Deploy kick-scraper
        run: supabase functions deploy kick-scraper --no-verify-jwt --project-ref gkccophrdqtqcowmblre
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
