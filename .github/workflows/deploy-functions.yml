name: Deploy Supabase Functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
  workflow_dispatch:

jobs:
  # Gate: every edge function must parse before any of them deploy. Catches a
  # typo in the paid ai-breakdown function before it reaches production, with a
  # precise error instead of an opaque `supabase deploy` failure.
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: Syntax-check edge functions
        run: npm run check:functions
      # ai-breakdown routes the roast to Grok and everything else to Claude.
      # A break there deploys clean and only shows up as a roast in the wrong
      # voice, so it gates the deploy alongside the syntax check.
      - name: Trash-talk model routing test
        run: npm run check:provider
      - name: Friday brief push test
        run: npm run check:brief
      - name: Replaced-bout alert test
        run: npm run check:swap
      - name: Fight IQ write-up test
        run: npm run check:iq

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1
        with:
          version: latest
      # --use-api: Supabase bundles each function server-side. Without it the
      # CLI pulls supabase/edge-runtime from ghcr.io on the runner, and that
      # registry's shared rate limit ("toomanyrequests") failed every deploy
      # on 2026-09-23 before a single function went out.
      - name: Deploy send-push
        run: supabase functions deploy send-push --use-api --project-ref gkccophrdqtqcowmblre
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - name: Deploy ai-breakdown
        run: supabase functions deploy ai-breakdown --use-api --project-ref gkccophrdqtqcowmblre
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - name: Deploy check-results
        run: supabase functions deploy check-results --no-verify-jwt --use-api --project-ref gkccophrdqtqcowmblre
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - name: Deploy send-reminders
        run: supabase functions deploy send-reminders --no-verify-jwt --use-api --project-ref gkccophrdqtqcowmblre
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - name: Deploy kick-scraper
        run: supabase functions deploy kick-scraper --no-verify-jwt --use-api --project-ref gkccophrdqtqcowmblre
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
