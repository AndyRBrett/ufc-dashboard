name: Update UFC Fight Cards

on:
  schedule:
    # Daily 9am UTC - card structure + odds update
    - cron: "0 9 * * *"
    # Every 4h Thu/Fri/Sat — the run-up to a typical Saturday card, when late
    # replacements land. A once-a-day pull missed the Jessie Rosas withdrawal
    # (announced after the 09:00 run, fighting the next day). Odds calls are
    # budget-gated inside scrape.py, so extra runs cost no API quota.
    - cron: "0 */4 * * 4,5,6"
    # Every 5 min during US prime-time fight windows - live results + push.
    # Covers BOTH Saturday-night and Sunday-night (ET) cards. ET start of each
    # window maps to UTC the same day 16:00 → next day 04:59.
    # Saturday card (Sat noon-midnight ET):
    - cron: "*/5 16-23 * * 6"
    - cron: "*/5 0-4 * * 0"
    # Sunday card (Sun noon-midnight ET) — e.g. UFC Freedom 250 (White House):
    - cron: "*/5 16-23 * * 0"
    - cron: "*/5 0-4 * * 1"

  workflow_dispatch:

concurrency:
  group: update-main
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write        # the data-health tracking issue
    outputs:
      pushed: ${{ steps.push.outputs.pushed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - name: Guard — fail fast if the scraper is broken before it can overwrite data.js
        run: |
          pip install pytest
          python -m py_compile scrape.py
          python -m pytest -q
      - name: Snapshot the published data.js so the gate can diff against it
        run: cp data.js /tmp/data-before.js
      - run: python scrape.py
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          SUPABASE_ANON: ${{ secrets.SUPABASE_ANON }}
      # The gate between a degraded scrape and a published card. Fails the job on
      # structural breakage (unparseable data, empty EVENTS, a card that lost
      # bouts) so the last-good data.js stays live and GitHub emails the failure.
      # Data gaps only warn — blocking those would also block live results.
      - name: Gate — refuse to publish structurally broken data
        run: python health.py --gate --baseline /tmp/data-before.js
      - name: Write per-event freshness status + odds snapshots for the Project Overseer
        run: python write_status.py
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
      - name: Rebuild per-fighter odds time-series + closing-line value
        run: python odds_series.py
      # Warnings don't block the publish, so they need somewhere to land that
      # isn't a workflow log nobody opens. One long-lived issue, rewritten in
      # place each run: GitHub emails when it opens, the body is always current
      # instead of a comment thread, and it auto-closes when the card is clean.
      - name: Report data gaps as a single tracking issue
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: "Data health: gaps on an imminent card"
        run: |
          test -f health-report.json || exit 0
          warn=$(jq '.summary.warn' health-report.json)
          num=$(gh issue list --state open --search "$TITLE in:title" --json number,title \
                --jq "[.[]|select(.title==env.TITLE)][0].number" 2>/dev/null || echo "")
          if [ "$warn" -gt 0 ]; then
            if [ -n "$num" ]; then
              gh issue edit "$num" --body-file health-report.md
            else
              gh issue create --title "$TITLE" --body-file health-report.md
            fi
          elif [ -n "$num" ]; then
            gh issue close "$num" --comment "Data health clean as of $(date -u +'%Y-%m-%d %H:%M UTC')."
          fi
      - id: push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Stage only what this run actually produced. `git add` on a missing
          # path exits 128 and, under bash -e, kills the step — so listing an
          # optional artifact inline would break the push. odds-state.json is
          # exactly that: it is written only when the odds budget allows a pull,
          # and a run that injects results exits before ever reaching that step.
          # A card night is mostly those runs, so this would have started failing
          # every 5 minutes mid-event and stopped results from publishing.
          # odds-alert-state.json carries the alert dedup high-water marks (#67).
          # It MUST be committed: the runner is ephemeral, so an uncommitted
          # state file resets every run and every standing mover re-alerts —
          # which is exactly the behaviour the dedup exists to stop.
          for f in data.js overseer-status.json odds-snapshots.jsonl \
                   odds-series.json odds-state.json odds-alert-state.json \
                   health-report.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if git diff --staged --quiet; then
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Auto-update $(date +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase -X theirs origin main
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      # Event-level failures must reach the RUN's failure signal (#66).
      #
      # Deliberately the last step, after the publish: a card carrying no odds is
      # still worth shipping (fighters, records and results are all there), so
      # this must not gate the commit the way health.py --gate does. But it does
      # need to turn the run red. Before this, write_status.py recorded the
      # failure in overseer-status.json and nothing acted on it — the job exited
      # 0, success_rate_7d stayed at 1.0, and the Project Overseer read a
      # perfectly healthy scraper while an event silently carried no lines.
      - name: Fail the run when an event-level parse failure was recorded
        if: always()
        run: |
          fail=0

          if [ -f overseer-status.json ]; then
            n=$(jq '.parse_failure_events // 0' overseer-status.json)
            if [ "$n" -gt 0 ]; then
              echo "::error::$n event(s) failed to parse — see overseer-status.json errors:"
              jq -r '.errors[]? | "  - " + .' overseer-status.json
              fail=1
            fi

            # Cards that could not be priced because the odds budget was spent.
            # Not a failure — it is the same self-healing condition the quota
            # check below warns about, and failing here would re-fail the run
            # through the back door for a root cause we already excused.
            u=$(jq '.odds_unavailable_events // 0' overseer-status.json)
            if [ "$u" -gt 0 ]; then
              echo "::warning::$u upcoming card(s) unpriced because the Odds API budget is spent — expected while the quota is exhausted, not a parse failure."
            fi
          fi

          # The Odds API answers 401 for BOTH a bad key and an exhausted quota,
          # and the two need opposite handling: a dead key never self-heals and
          # needs a human, while an exhausted quota fixes itself at the monthly
          # reset. Failing the run on the quota case would just paint the
          # workflow red every 5 minutes until the 1st, which trains you to
          # ignore it — and then the dead-key case goes unnoticed too.
          #
          # x-requests-remaining tells them apart: 0 means we spent the budget,
          # anything else (or a 401 with quota left) means the key itself was
          # rejected.
          if [ -f odds-state.json ]; then
            s=$(jq '.last_status // 200' odds-state.json)
            rem=$(jq '.requests_remaining // -1' odds-state.json)
            if { [ "$s" = "401" ] || [ "$s" = "403" ]; } && [ "$rem" = "0" ]; then
              echo "::warning::Odds API quota exhausted for the month — lines are frozen until it resets. Not failing the run; this recovers on its own."
            elif [ "$s" = "401" ] || [ "$s" = "403" ]; then
              echo "::error::Odds API rejected our key (HTTP $s, quota remaining $rem) — odds are frozen. Rotate ODDS_API_KEY."
              fail=1
            fi
          fi

          [ "$fail" = "0" ] && echo "No event-level parse failures." || exit 1

  # GITHUB_TOKEN pushes never trigger `on: push` workflows, so the Pages deploy
  # must be chained here explicitly. Only runs when a commit was actually pushed
  # (mirrors the old branch-based Pages build, which only ran on real pushes).
  deploy:
    needs: update
    if: needs.update.outputs.pushed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
