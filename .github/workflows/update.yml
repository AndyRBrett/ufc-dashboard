name: Update UFC Fight Cards

on:
  schedule:
    # Daily 9am UTC - card structure + odds update
    - cron: "0 9 * * *"
    # Every 15 min Sat 4pm-4am UTC (noon-midnight ET) - fight night results
    - cron: "*/5 16-23 * * 6"
    - cron: "*/5 0-4 * * 0"

  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4 pywebpush
      - run: python scrape.py
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --staged --quiet || git commit -m "Auto-update $(date +'%Y-%m-%d %H:%M UTC')"
          git push
