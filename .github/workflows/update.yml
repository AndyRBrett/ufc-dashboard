name: Update UFC Fight Cards

on:
  schedule:
    # Daily 9am UTC - card structure + odds update
    - cron: "0 9 * * *"
    # Every 5 min Sat 4pm-4am UTC (noon-midnight ET) - fight night results
    - cron: "*/5 16-23 * * 6"
    - cron: "*/5 0-4 * * 0"

  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - name: Guard — fail fast if the scraper is broken before it can overwrite data.js
        run: |
          pip install pytest
          python -m py_compile scrape.py
          python -m pytest -q
      - run: python scrape.py
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          SUPABASE_ANON: ${{ secrets.SUPABASE_ANON }}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.js
          git diff --staged --quiet || git commit -m "Auto-update $(date +'%Y-%m-%d %H:%M UTC')"
          git push
