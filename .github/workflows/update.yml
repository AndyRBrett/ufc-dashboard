name: Update UFC Fight Cards

on:
  schedule:
    # Daily 9am UTC - card structure + odds update
    - cron: "0 9 * * *"
    # Every 5 min during US prime-time fight windows - live results + push.
    # Covers BOTH Saturday-night and Sunday-night (ET) cards. ET start of each
    # window maps to UTC the same day 16:00 → next day 04:59.
    # Saturday card (Sat noon-midnight ET):
    - cron: "*/5 16-23 * * 6"
    - cron: "*/5 0-4 * * 0"
    # Sunday card (Sun noon-midnight ET) — e.g. UFC Freedom 250 (White House):
    - cron: "*/5 16-23 * * 0"
    - cron: "*/5 0-4 * * 1"

  workflow_dispatch:

concurrency:
  group: update-main
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      pushed: ${{ steps.push.outputs.pushed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - name: Guard — fail fast if the scraper is broken before it can overwrite data.js
        run: |
          pip install pytest
          python -m py_compile scrape.py
          python -m pytest -q
      - run: python scrape.py
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          SUPABASE_ANON: ${{ secrets.SUPABASE_ANON }}
      - name: Write per-event freshness status + odds snapshots for the Project Overseer
        run: python write_status.py
      - name: Rebuild per-fighter odds time-series + closing-line value
        run: python odds_series.py
      - id: push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.js overseer-status.json odds-snapshots.jsonl odds-series.json
          if git diff --staged --quiet; then
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Auto-update $(date +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase -X theirs origin main
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

  # GITHUB_TOKEN pushes never trigger `on: push` workflows, so the Pages deploy
  # must be chained here explicitly. Only runs when a commit was actually pushed
  # (mirrors the old branch-based Pages build, which only ran on real pushes).
  deploy:
    needs: update
    if: needs.update.outputs.pushed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
