name: Update UFC Fight Cards

on:
  schedule:
    # Daily 9am UTC (4am CT / 5am ET) - card structure + odds
    - cron: "0 9 * * *"
    # Every 10 min Sat noon-midnight ET (4pm-4am UTC Sat-Sun)
    - cron: "*/10 16-23 * * 6"
    - cron: "*/10 0-4 * * 0"
    # Every 30 min Sun 4am-7am UTC (post-card cooldown)
    - cron: "*/30 4-7 * * 0"

  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - run: python scrape.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --staged --quiet || git commit -m "Auto-update $(date +'%Y-%m-%d %H:%M UTC')"
          git push
