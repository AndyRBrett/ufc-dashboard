name: Dump Wikipedia Wikitext

on:
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python dump_wiki.py > wikitext_allen.txt
      - uses: actions/upload-artifact@v4
        with:
          name: wikitext-allen
          path: wikitext_allen.txt
