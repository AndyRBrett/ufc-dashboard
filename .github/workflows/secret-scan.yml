name: Secret Scan

on:
  push:
  pull_request:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the scan covers past commits, not just the latest.
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Config lives at repo root (.gitleaks.toml) and allowlists the
          # public-by-design Supabase anon key so only genuinely new secrets fail.
          GITLEAKS_CONFIG: .gitleaks.toml
