# Deploys the dashboard to GitHub Pages via Actions, replacing the GitHub-managed
# "pages build and deployment" branch workflow.
#
# Why: the managed workflow's deploy step (actions/deploy-pages) intermittently
# fails with "Deployment failed, try again later." — a transient Pages backend
# error it never retries (issue #25; 7-day success rate dropped to 86%). Owning
# the deploy lets us retry the transient failure instead of dropping the update.
#
# Triggered three ways:
#   - workflow_call from update.yml after it pushes fresh data (pushes made with
#     GITHUB_TOKEN never fire `on: push` workflows, so the explicit call is required)
#   - push to main (human commits / PR merges)
#   - workflow_dispatch (manual redeploy)
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # Gate: the app must boot and all web assets must be valid before we publish.
  # deploy `needs:` this, so a syntax typo or a non-booting build is blocked from
  # production instead of white-paging everyone (including on the automated
  # data-update path, which reaches this workflow via workflow_call).
  validate:
    uses: ./.github/workflows/validate-web.yml
    # Validate the exact tip we deploy — deploy checks out main, and on the
    # data-update path the run's own SHA predates that auto-pushed commit.
    with:
      ref: main

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    # Queue deploys instead of overlapping; never cancel an in-flight production deploy.
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy1.outputs.page_url || steps.deploy2.outputs.page_url || steps.deploy3.outputs.page_url }}
    steps:
      # Always deploy the tip of main: when called from update.yml, the run's own
      # SHA predates the auto-update commit that job just pushed.
      - uses: actions/checkout@v4
        with:
          ref: main

      # deploy-pages labels the deployment with $GITHUB_SHA, which on the
      # workflow_call path is the caller's *starting* SHA — one commit behind the
      # tip we just checked out. Capture the real tip and hand it to the deploy
      # steps below so the Pages environment names the commit it actually serves.
      - name: Record the commit being published
        id: head
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Ensure Pages publishing source is "GitHub Actions"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build_type=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .build_type || echo unknown)
          if [ "$build_type" = "workflow" ]; then
            exit 0
          fi
          if gh api --method PUT "repos/$GITHUB_REPOSITORY/pages" -f build_type=workflow; then
            echo "Switched Pages publishing source from '$build_type' to GitHub Actions."
          else
            echo "::warning::Could not switch the Pages publishing source automatically. If the deploy step below fails, set Settings → Pages → Source to 'GitHub Actions' once, manually."
          fi

      - uses: actions/configure-pages@v5

      # The site is served raw from the repo root (build.mjs is optional and unused
      # by the deploy), so upload the checkout as-is. upload-pages-artifact already
      # excludes .git and .github.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      # Two distinct transient failures have to be survived here:
      #
      #   1. "Deployment failed, try again later." — terminal for a single
      #      deploy-pages invocation (its internal error_count only retries
      #      status-poll errors), so the whole action is retried with backoff.
      #   2. The deployment sitting in `deployment_queued` past the action's
      #      timeout, which is what broke run 31097418363 (10 min was not enough
      #      for a backed-up Pages queue). Hence the 20-minute first attempt.
      #
      # The timeout path also *cancels* the deployment on its way out, and a
      # deployment is keyed by build version (deploy-pages sends $GITHUB_SHA as
      # pages_build_version). Re-submitting the same version after a cancel is
      # dead on arrival — that is why both retries failed instantly in that run.
      # Each attempt therefore gets its own version string.
      - name: Deploy to GitHub Pages
        id: deploy1
        uses: actions/deploy-pages@v5
        continue-on-error: true
        env:
          GITHUB_SHA: ${{ steps.head.outputs.sha }}
        with:
          timeout: 1200000

      - name: Wait 30s before retry
        if: steps.deploy1.outcome == 'failure'
        run: sleep 30
      - name: Deploy to GitHub Pages (retry 1)
        id: deploy2
        if: steps.deploy1.outcome == 'failure'
        uses: actions/deploy-pages@v5
        continue-on-error: true
        env:
          GITHUB_SHA: ${{ steps.head.outputs.sha }}-retry1

      - name: Wait 60s before final retry
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        run: sleep 60
      - name: Deploy to GitHub Pages (retry 2)
        id: deploy3
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        uses: actions/deploy-pages@v5
        env:
          GITHUB_SHA: ${{ steps.head.outputs.sha }}-retry2

      - name: Flag that the deploy only succeeded on a retry
        if: steps.deploy1.outcome == 'failure' && (steps.deploy2.outcome == 'success' || steps.deploy3.outcome == 'success')
        run: echo "::warning::Pages deploy succeeded only after retrying a transient 'Deployment failed, try again later.' error."
