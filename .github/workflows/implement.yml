# Implementer for ufc-dashboard — configuration only.
#
# Everything the agent does (the author guard, the tier mapping, the prompt, the
# failure taxonomy) lives in one reusable workflow in the overseer. This file
# says which toolchain and which test command, and nothing else. It used to be a
# ~215-line copy; a fix to the shared logic then meant five edits across four
# repos, and a security sweep hardened three copies and missed two.
#
# The job still runs HERE: a called workflow runs against the calling repo, so
# the checkout, the code, the branch and the Anthropic key are all this repo's.

name: Implement a filed issue

on:
  repository_dispatch:
    types: [overseer-implement]
  workflow_dispatch:
    inputs:
      issue:
        description: "Issue number to implement"
        required: true
        type: string
      tier:
        description: "Model tier for this attempt"
        type: choice
        default: light
        options: [light, heavy]
        required: false

permissions:
  contents: write        # push the branch
  pull-requests: write   # open the PR
  issues: write          # comment / close / label when it can't be implemented

concurrency:
  group: implement-${{ github.event.client_payload.issue || inputs.issue }}
  cancel-in-progress: false

jobs:
  implement:
    # Pinned to a commit, not @main: this job hands the reusable workflow the
    # Anthropic key and the PR App's private key, so whatever lands on the
    # overseer's main would otherwise run here with them the next time an issue
    # is dispatched. Moving it is a deliberate edit to this line (overseer#97,
    # "only trusted text reaches the agent", is what this SHA includes).
    uses: AndyRBrett/overseer/.github/workflows/implementer.yml@34f51ab46ea2d20aff2ce001a761038193d062b9 # overseer#97
    with:
      issue: ${{ github.event.client_payload.issue || inputs.issue }}
      tier: ${{ github.event.client_payload.tier || inputs.tier }}
      # Two gates: ci.yml runs pytest, and validate-web.yml runs the Node checks
      # pages.yml blocks deploys on. An issue can land on either side, so both
      # toolchains are installed rather than guessing which one it needs.
      python_version: "3.12"
      node_version: "20"
      install: pip install requests beautifulsoup4 pytest && npm ci
      test_command: python -m pytest -q
      test_note: >-
        If you touched the dashboard, data files, or edge functions, also run the
        web gate that blocks releases: `npm run verify`.
    secrets:
      anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
      # WHO OPENS THE PULL REQUEST decides whether anything checks it. PR #130,
      # the first this repo's implementer ever produced, opened as
      # github-actions[bot]: both checks landed in `action_required` waiting on
      # a human tap, and Codex never reviewed it, because that App reviews a PR
      # opened by a PERSON and a bot cannot ask for a review on its own. A PR
      # opened with these credentials is an ordinary PR, so CI runs and the
      # review arrives unasked.
      #
      # An installation token CANNOT be stored as a secret: it dies within the
      # hour, and an expired secret is still non-empty, so the `||` fallback in
      # the shared workflow would never engage and every later run would fail
      # authentication. These are the App's id and private key; the token is
      # minted fresh per run from them.
      pr_app_id: ${{ secrets.OVERSEER_PR_APP_ID }}
      pr_app_private_key: ${{ secrets.OVERSEER_PR_APP_PRIVATE_KEY }}
      # Unset today. Here so adding a PAT later is a secret, not a workflow edit
      # — and with all three empty the run still works and warns that it did.
      pr_token: ${{ secrets.OVERSEER_PR_TOKEN }}
