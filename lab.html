  the Fight Week brief, Matchup Lab, the Watch Party ticker and the promotions
  hub. It never writes a pick, a lock or a pref: everything here is derived from
  data.js, odds-series.json, intel.json, events-extra.json and the public picks
  read the app already makes. If this page breaks, the app is untouched.

  while((m=re.exec(html))){
    var decls=[],d,dre=/(--[a-z0-9-]+)\s*:\s*([^;{}]+)/g;
    while((d=dre.exec(m[2]))){if(LAB_THEME_VARS.test(d[1])&&d[2].indexOf("url(")<0)decls.push(d[1]+":"+d[2].trim());}

// ✍️ The AI scouting report. The numbers above are computed here, in the
// browser; the ai-breakdown "fight-iq" action only writes prose around them,
// in a voice it picks at random, and refuses to state a number it wasn't given.
// Capped per device per day (IQ_WRITEUPS_PER_DAY) — each one is a paid call —
// and again, best-effort, on the server.
var IQ_WRITEUPS_PER_DAY=3;
function _iqUsage(){var t=PE.isoDate(new Date()),u=null;try{u=JSON.parse(localStorage.getItem("ufc_iq_writeups")||"null");}catch(e){}return u&&u.day===t?u:{day:t,n:0};}
function _iqSpend(){var u=_iqUsage();u.n++;try{localStorage.setItem("ufc_iq_writeups",JSON.stringify(u));}catch(e){}}
function iqFactsFor(iq){
  var nick=(players().filter(function(u){return u.player===L.player;})[0]||{}).nickname||"";
  var clip=function(t){return String(t).slice(0,200);};
  return {player:nameOnly(nick).slice(0,60)||"This picker",archetype:iq.archetype.name,blurb:iq.archetype.blurb,
    record:iq.record.w+"-"+iq.record.l,accuracy:iq.record.pct,points:iq.points,
    locks:iq.locks.n?iq.locks.w+"-"+iq.locks.l:"",methodPct:iq.methods.called?iq.methods.pct:null,
    clv:iq.clv.n>=FL.MIN_SAMPLE?iq.clv.avg:null,insights:iq.insights.slice(0,8).map(function(i){return clip(i.text);})};
}
function writeupBlock(iq){
  var out=h("div",{class:"small",style:"margin-top:12px;line-height:1.55"});
  var btn=h("button",{class:"act",style:"margin-top:12px",text:"✍️ Write the scouting report"});
  if(iq.record.n<5){btn.disabled=true;btn.title="Needs at least 5 decided picks";}
  btn.addEventListener("click",function(){
    if(_iqUsage().n>=IQ_WRITEUPS_PER_DAY){out.textContent="That's "+IQ_WRITEUPS_PER_DAY+" scouting reports today — the scouts are off until tomorrow.";return;}
    btn.disabled=true;btn.textContent="Writing…";out.textContent="";
    fetch(SUPABASE_URL+"/functions/v1/ai-breakdown",{method:"POST",
      headers:{"Content-Type":"application/json",Authorization:"Bearer "+SUPABASE_ANON},
      body:JSON.stringify({action:"fight-iq",iq:iqFactsFor(iq),viewerId:L.me||""})})
      .then(function(r){return r.json().then(function(j){return {ok:r.ok,j:j};});})
      .then(function(x){
        if(x.ok&&x.j.breakdown){
          _iqSpend();
          out.textContent="";
          out.appendChild(h("p",{style:"margin:0",text:x.j.breakdown}));
          if(x.j.tone)out.appendChild(h("div",{class:"muted",style:"margin-top:6px;font-size:12px",text:"Voice: "+x.j.tone}));
        }else if(x.j&&x.j.error==="daily-cap"){out.textContent="That's today's scouting reports used up — back tomorrow.";}
        else out.textContent=(x.j&&x.j.error)||"Couldn't write it right now — try again.";
      })
      .catch(function(){out.textContent="Couldn't reach the scouts — check your connection.";})
      .then(function(){btn.disabled=iq.record.n<5;btn.textContent="✍️ Write another";});
  });
  return h("div",null,btn,out);
}

function spark(series,side,label){
  var pts=series.map(function(p){return {at:p.at,prob:FL.probOf(p,side),odds:side===0?p.a:p.b};}).filter(function(p){return p.prob!==null;});
  if(pts.length<2)return null;
  var W=300,H=44,pad=4,min=1,max=0;
  pts.forEach(function(p){min=Math.min(min,p.prob);max=Math.max(max,p.prob);});
  if(max-min<0.04){var mid=(max+min)/2;min=mid-0.02;max=mid+0.02;}
  var t0=Date.parse(pts[0].at),t1=Date.parse(pts[pts.length-1].at)||t0+1;
  function x(p){return pad+(Date.parse(p.at)-t0)/Math.max(1,t1-t0)*(W-2*pad);}
  function y(p){return H-pad-(p.prob-min)/(max-min)*(H-2*pad);}
  var NS="http://www.w3.org/2000/svg",svg=document.createElementNS(NS,"svg");
  svg.setAttribute("viewBox","0 0 "+W+" "+H);svg.setAttribute("class","spark");svg.setAttribute("preserveAspectRatio","none");
  svg.setAttribute("role","img");svg.setAttribute("aria-label",label+": implied win probability from "+Math.round(pts[0].prob*100)+"% to "+Math.round(pts[pts.length-1].prob*100)+"%");
  var path=document.createElementNS(NS,"polyline");
  path.setAttribute("points",pts.map(function(p){return x(p).toFixed(1)+","+y(p).toFixed(1);}).join(" "));
  path.setAttribute("fill","none");path.setAttribute("stroke","var(--red)");path.setAttribute("stroke-width","2");path.setAttribute("vector-effect","non-scaling-stroke");path.setAttribute("stroke-linejoin","round");
  svg.appendChild(path);
  var tip=document.getElementById("tip");
  pts.forEach(function(p){
    var c=document.createElementNS(NS,"circle");
    c.setAttribute("cx",x(p));c.setAttribute("cy",y(p));c.setAttribute("r","9");c.setAttribute("class","hit");
    c.addEventListener("pointerenter",function(e){tip.textContent=label+" "+FL.fmtOdds(p.odds)+" · "+Math.round(p.prob*100)+"% · "+new Date(p.at).toLocaleString(undefined,{month:"short",day:"numeric",hour:"numeric"});tip.style.display="block";tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY-30)+"px";});
    c.addEventListener("pointerleave",function(){tip.style.display="none";});
    svg.appendChild(c);
  });
  return svg;
}
