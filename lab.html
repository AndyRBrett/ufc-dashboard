function buildEngine(){

function load(){
  var id=myIdentity();L.me=id.id;L.myName=id.name;

    fetch("./index.html",{cache:"no-store"}).then(function(r){if(!r.ok)throw new Error("index.html HTTP "+r.status);return r.text();}).then(function(t){L.html=t;applyAppTheme(t);}),
    fetch("./scoring.js",{cache:"no-store"}).then(function(r){if(!r.ok)throw new Error("scoring.js HTTP "+r.status);return r.text();}).then(function(t){L.scoring=t;}),
    getJSON("./odds-series.json").then(function(j){L.oddsRaw=j;L.odds=FL.oddsIndex(j);}).catch(function(e){L.errors.push("Odds history unavailable ("+e.message+").");L.odds=FL.oddsIndex(null);}),
    getJSON("./intel.json").then(function(j){L.intel=j;}).catch(function(){L.intel=null;}),

// ------------------------------------------------------------------ views --
function players(){
  var by={};
  L.picks.forEach(function(p){
    var u=by[p.player]=by[p.player]||{player:p.player,nickname:p.nickname,n:0};
    u.n++;if(p.nickname)u.nickname=p.nickname;

  return Object.keys(by).map(function(k){return by[k];}).sort(function(a,b){return b.n-a.n;});
}
function defaultPlayer(list){
  if(L.me&&list.some(function(u){return u.player===L.me;}))return L.me;
  var base=nameOnly(L.myName).toLowerCase();
  var hit=base&&list.filter(function(u){return nameOnly(u.nickname).toLowerCase()===base;})[0];
  return hit?hit.player:(list[0]&&list[0].player)||null;
}
function playerPicker(onchange){

  var sel=h("select",{"aria-label":"Player",onchange:function(){L.player=this.value;onchange();}},
    list.map(function(u){return h("option",{value:u.player,selected:u.player===L.player,text:(u.nickname||"Unknown")+(u.player===L.me?" (you)":"")});}));

}
function edgeFor(b){

}

function shareCard(fc,sn,img,btn){

// ✍️ The AI scouting report. The numbers above are computed here, in the
// browser; the ai-breakdown "fight-iq" action only writes prose around them,
// in a voice it picks at random, and refuses to state a number it wasn't given.
// Capped per device per day (IQ_WRITEUPS_PER_DAY) — each one is a paid call —
// and again, best-effort, on the server.
var IQ_WRITEUPS_PER_DAY=3;
function _iqUsage(){var t=PE.isoDate(new Date()),u=null;try{u=JSON.parse(localStorage.getItem("ufc_iq_writeups")||"null");}catch(e){}return u&&u.day===t?u:{day:t,n:0};}
function _iqSpend(){var u=_iqUsage();u.n++;try{localStorage.setItem("ufc_iq_writeups",JSON.stringify(u));}catch(e){}}
function iqFactsFor(iq){
  var nick=(players().filter(function(u){return u.player===L.player;})[0]||{}).nickname||"";
  var clip=function(t){return String(t).slice(0,200);};
  return {player:nameOnly(nick).slice(0,60)||"This picker",archetype:iq.archetype.name,blurb:iq.archetype.blurb,
    record:iq.record.w+"-"+iq.record.l,accuracy:iq.record.pct,points:iq.points,
    locks:iq.locks.n?iq.locks.w+"-"+iq.locks.l:"",methodPct:iq.methods.called?iq.methods.pct:null,
    clv:iq.clv.n>=FL.MIN_SAMPLE?iq.clv.avg:null,insights:iq.insights.slice(0,8).map(function(i){return clip(i.text);})};

function writeupBlock(iq){
  var out=h("div",{class:"small",style:"margin-top:12px;line-height:1.55"});
  var btn=h("button",{class:"act",style:"margin-top:12px",text:"✍️ Write the scouting report"});
  if(iq.record.n<5){btn.disabled=true;btn.title="Needs at least 5 decided picks";}
  btn.addEventListener("click",function(){
    if(_iqUsage().n>=IQ_WRITEUPS_PER_DAY){out.textContent="That's "+IQ_WRITEUPS_PER_DAY+" scouting reports today — the scouts are off until tomorrow.";return;}
    btn.disabled=true;btn.textContent="Writing…";out.textContent="";
    fetch(SUPABASE_URL+"/functions/v1/ai-breakdown",{method:"POST",
      headers:{"Content-Type":"application/json",Authorization:"Bearer "+SUPABASE_ANON},
      body:JSON.stringify({action:"fight-iq",iq:iqFactsFor(iq),viewerId:L.me||""})})
      .then(function(r){return r.json().then(function(j){return {ok:r.ok,j:j};});})
      .then(function(x){
        if(x.ok&&x.j.breakdown){
          _iqSpend();
          out.textContent="";
          out.appendChild(h("p",{style:"margin:0",text:x.j.breakdown}));
          if(x.j.tone)out.appendChild(h("div",{class:"muted",style:"margin-top:6px;font-size:12px",text:"Voice: "+x.j.tone}));
        }else if(x.j&&x.j.error==="daily-cap"){out.textContent="That's today's scouting reports used up — back tomorrow.";}
        else out.textContent=(x.j&&x.j.error)||"Couldn't write it right now — try again.";
      })
      .catch(function(){out.textContent="Couldn't reach the scouts — check your connection.";})
      .then(function(){btn.disabled=iq.record.n<5;btn.textContent="✍️ Write another";});
  });
  return h("div",null,btn,out);
}

function spark(series,side,label){
  var pts=series.map(function(p){return {at:p.at,prob:FL.probOf(p,side),odds:side===0?p.a:p.b};}).filter(function(p){return p.prob!==null;});
  if(pts.length<2)return null;
  var W=300,H=44,pad=4,min=1,max=0;
  pts.forEach(function(p){min=Math.min(min,p.prob);max=Math.max(max,p.prob);});
  if(max-min<0.04){var mid=(max+min)/2;min=mid-0.02;max=mid+0.02;}
  var t0=Date.parse(pts[0].at),t1=Date.parse(pts[pts.length-1].at)||t0+1;
  function x(p){return pad+(Date.parse(p.at)-t0)/Math.max(1,t1-t0)*(W-2*pad);}
  function y(p){return H-pad-(p.prob-min)/(max-min)*(H-2*pad);}
  var NS="http://www.w3.org/2000/svg",svg=document.createElementNS(NS,"svg");
  svg.setAttribute("viewBox","0 0 "+W+" "+H);svg.setAttribute("class","spark");svg.setAttribute("preserveAspectRatio","none");
  svg.setAttribute("role","img");svg.setAttribute("aria-label",label+": implied win probability from "+Math.round(pts[0].prob*100)+"% to "+Math.round(pts[pts.length-1].prob*100)+"%");
  var path=document.createElementNS(NS,"polyline");
  path.setAttribute("points",pts.map(function(p){return x(p).toFixed(1)+","+y(p).toFixed(1);}).join(" "));
  path.setAttribute("fill","none");path.setAttribute("stroke","var(--red)");path.setAttribute("stroke-width","2");path.setAttribute("vector-effect","non-scaling-stroke");path.setAttribute("stroke-linejoin","round");
  svg.appendChild(path);
  var tip=document.getElementById("tip");
  pts.forEach(function(p){
    var c=document.createElementNS(NS,"circle");
    c.setAttribute("cx",x(p));c.setAttribute("cy",y(p));c.setAttribute("r","9");c.setAttribute("class","hit");
    c.addEventListener("pointerenter",function(e){tip.textContent=label+" "+FL.fmtOdds(p.odds)+" · "+Math.round(p.prob*100)+"% · "+new Date(p.at).toLocaleString(undefined,{month:"short",day:"numeric",hour:"numeric"});tip.style.display="block";tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY-30)+"px";});
    c.addEventListener("pointerleave",function(){tip.style.display="none";});
    svg.appendChild(c);
  });
  return svg;
}

function viewMatchup(root){
  // A menu of real matchups, never free text: every upcoming UFC bout whose
  // two fighters both have a UFCStats profile, grouped by card. Choosing one
  // compares it straight away.
  var names=Object.keys(FIGHTER_STATS);
  var now=new Date(),upcoming=L.engine.upcoming(now,"ufc");
  var pair=[null,null];
  var bout=h("select",{"aria-label":"Pick a bout from an upcoming card",class:"mu-sel mu-bout",onchange:function(){
    pair=this.value?this.value.split("\n"):[null,null];go();}});
  var first=null;
  upcoming.forEach(function(ev){
    var og=h("optgroup",{label:ev.name+" · "+fmtDate(ev.date)}),n=0;
    ev.bouts.forEach(function(bt){
      var c=bt.competitors;if(!c||!FIGHTER_STATS[c[0].name]||!FIGHTER_STATS[c[1].name])return;
      var v=c[0].name+"\n"+c[1].name;if(!first)first=v;
      og.appendChild(h("option",{value:v,text:c[0].name+" vs "+c[1].name}));n++;
    });

  function go(){
    out.textContent="";

    var m=FL.matchup(resolveName(pair[0]),resolveName(pair[1]),{stats:FIGHTER_STATS,rankings:RANKINGS,archive:RESULTS_ARCHIVE,kernel:L.kernel,fighterOdds:L.oddsRaw&&L.oddsRaw.fighters});
    if(m.missing){out.appendChild(card(null,h("div",{class:"err",text:"No UFCStats profile cached for "+m.missing.join(" and ")+". Only fighters who've appeared on a recent card are in the stats cache."})));return;}
    var t=h("table",{class:"cmp"},h("tr",null,h("th",{style:"text-align:center",text:m.a}),h("th"),h("th",{style:"text-align:center",text:m.b})));
    m.rows.forEach(function(r){t.appendChild(h("tr",null,h("td",{class:r.edge===1?"edge good":"",text:String(r.a)}),h("td",{class:"lbl",text:r.label}),h("td",{class:r.edge===2?"edge good":"",text:String(r.b)})));});
    t.appendChild(h("tr",null,h("td",{text:m.formA||"—"}),h("td",{class:"lbl",text:"Last 5 (newest first)"}),h("td",{text:m.formB||"—"})));
    out.appendChild(card("Tale of the tape",h("div",{class:"wrap-scroll"},t)));
    if(m.model){
      var p1=Math.round(m.model.p1*100);
      out.appendChild(card("The model's estimate",
        h("div",{class:"row",style:"justify-content:space-between;font-weight:700"},h("span",{text:m.a+" "+p1+"%"}),h("span",{text:(100-p1)+"% "+m.b})),
        h("div",{class:"bar",style:"margin:8px 0","aria-hidden":"true"},h("i",{style:"width:"+p1+"%;background:var(--red)"}),h("i",{style:"flex:1;background:var(--muted)"})),
        h("p",{class:"muted small",text:"The same Elo-plus-style model that sits under the moneyline on the cards (confidence "+m.model.confidence+"). An estimate, not a truth — see the backtest below."})));
    }
    if(m.notes.length){var nu=h("ul",{class:"list"});m.notes.forEach(function(n){nu.appendChild(h("li",null,h("span",{class:"ico",text:"•"}),h("span",{text:n})));});out.appendChild(card("What stands out",nu));}
    var hist=[["a",m.a],["b",m.b]].filter(function(x){return m.history[x[0]].length;});
    if(hist.length){
      var ht=h("table",null,h("tr",null,h("th",{text:"Fighter"}),h("th",{text:"Opponent"}),h("th",{class:"num",text:"Open"}),h("th",{class:"num",text:"Close"})));
      hist.forEach(function(x){m.history[x[0]].slice(-4).forEach(function(r){ht.appendChild(h("tr",null,h("td",{text:x[1]}),h("td",{text:r.opponent}),h("td",{class:"num",text:FL.fmtOdds(r.open)}),h("td",{class:"num",text:r.close==null?"open":FL.fmtOdds(r.close)})));});});
      out.appendChild(card("Betting history",h("div",{class:"wrap-scroll"},ht)));
    }
  }
  root.appendChild(card("Pick a matchup",first?bout:h("div",{class:"empty",text:"No upcoming bouts with fighter stats yet — check back once the next card is set."})));
  root.appendChild(out);
  var bt=FL.backtest({stats:FIGHTER_STATS,rankings:RANKINGS,archive:RESULTS_ARCHIVE,kernel:L.kernel,odds:L.odds});
  if(bt)root.appendChild(card("Model backtest",h("div",{class:"tiles"},
      tile(bt.n,"Clean bouts scored"),tile(pctTxt(bt.pct),"Model picked the winner"),
      tile(bt.vsMarket.n?pctTxt(bt.vsMarket.market):"—","Closing favorite won (same bouts)"),tile(bt.brier==null?"—":bt.brier,"Brier score (lower is better)")),
    h("p",{class:"muted small",text:"Only bouts where both fighters' stats were fetched before fight night count — "+bt.excluded+" archived bouts are left out because their stats already include the result. The sample grows every card."})));
  go();
}
