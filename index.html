<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>UFC Fight Cards</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>

:root{--red:#e8192c;--gold:#c9a84c;--bg:#0a0a0a;--card:#141414;--card2:#1c1c1c;--border:rgba(255,255,255,.09);--border2:rgba(255,255,255,.16);--text:#f0f0f0;--muted:#666;--muted2:#999;--green:#2ecc71;--hdr-bg:rgba(10,10,10,.97);--surface:#1c1c1c;--future-bg:#111;--future-border:#2a2a2a;--btn-bg:rgba(255,255,255,.08);--sep:rgba(255,255,255,.14);--stripe-border:rgba(255,255,255,.06);--pill-bg:rgba(255,255,255,.06);--bar-bg:rgba(255,255,255,.1);--pending-bg:rgba(255,255,255,.05)}
body.light{--bg:#f2f2f7;--card:#ffffff;--card2:#e9e9ef;--border:rgba(0,0,0,.1);--border2:rgba(0,0,0,.18);--text:#111111;--muted:#8e8e93;--muted2:#555555;--hdr-bg:rgba(242,242,247,.97);--surface:#ffffff;--future-bg:#f5f5f5;--future-border:#d8d8d8;--btn-bg:rgba(0,0,0,.06);--sep:rgba(0,0,0,.2);--stripe-border:rgba(0,0,0,.1);--pill-bg:rgba(0,0,0,.07);--bar-bg:rgba(0,0,0,.1);--pending-bg:rgba(0,0,0,.05)}
#themeBtn .theme-moon{display:none}
body.light #themeBtn .theme-sun{display:none}
body.light #themeBtn .theme-moon{display:block}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:DM Sans,sans-serif;min-height:100vh;padding-bottom:60px;font-size:15px}
.hdr{display:flex;align-items:center;justify-content:space-between;padding:0 16px;height:52px;border-bottom:1px solid var(--border);background:var(--hdr-bg);backdrop-filter:blur(8px);position:sticky;top:0;z-index:99}
.logo{display:flex;align-items:center;gap:8px}
.logo-hex{width:28px;height:28px;background:var(--red);clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);display:flex;align-items:center;justify-content:center;font-family:Bebas Neue,sans-serif;font-size:10px;color:#fff}
.logo-text{font-family:Bebas Neue,sans-serif;font-size:22px;letter-spacing:.08em}
.logo-text span{color:var(--red)}
.hdr-right{display:flex;align-items:center;gap:8px}
.btn-icon{background:var(--card2);border:1px solid var(--border2);color:var(--muted2);width:34px;height:34px;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:color .15s}
.btn-icon svg{width:15px;height:15px}
.btn-ufc{background:var(--red);border:none;color:#fff;padding:6px 10px;border-radius:6px;font:600 11px DM Sans,sans-serif;cursor:pointer;text-decoration:none;display:flex;align-items:center;gap:3px}
.fn-banner{background:linear-gradient(90deg,var(--red),#a00);padding:8px 16px;display:none;align-items:center;gap:10px}
.fn-banner.show{display:flex}
.fn-banner-text{font-family:Bebas Neue,sans-serif;font-size:14px;letter-spacing:.08em;color:#fff}
.fn-banner-dot{width:7px;height:7px;border-radius:50%;background:#fff;animation:blink 1s infinite;flex-shrink:0}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.hero{padding:18px 16px 14px;border-bottom:1px solid var(--border)}
.hero h1{font-family:Bebas Neue,sans-serif;font-size:32px;letter-spacing:.07em;line-height:1}
.hero h1 span{color:var(--red)}
.hero-sub{font-size:11px;color:var(--muted);margin-top:4px}
.cd-wrap{margin-top:12px;background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:10px 14px}
.cd-label{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-bottom:4px}
.cd-event{font-size:11px;font-weight:600;color:var(--text);margin-bottom:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cd-timer{display:flex;align-items:center;gap:6px}
.cd-unit{text-align:center;min-width:38px}
.cd-num{font-family:Bebas Neue,sans-serif;font-size:26px;line-height:1;color:var(--red)}
.cd-lbl{font-size:8px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-top:1px}
.cd-sep{font-family:Bebas Neue,sans-serif;font-size:20px;color:var(--border2);padding-bottom:10px}
.cd-live{display:inline-block;background:rgba(232,25,44,.15);color:var(--red);border:1px solid rgba(232,25,44,.3);font-size:11px;font-weight:600;padding:4px 12px;border-radius:4px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);background:var(--card);border-bottom:1px solid var(--border)}
.stat{padding:10px 6px;text-align:center;border-right:1px solid var(--border)}
.stat:last-child{border-right:none}
.sv{font-family:Bebas Neue,sans-serif;font-size:22px;letter-spacing:.05em;line-height:1}
.sl{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-top:2px}
.filter-wrap{padding:10px 12px;border-bottom:1px solid var(--border);display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.filter-wrap::-webkit-scrollbar{display:none}
.ftab{padding:5px 12px;border-radius:20px;font-size:11px;font-weight:600;color:var(--muted);border:1px solid var(--border);background:none;cursor:pointer;white-space:nowrap;transition:all .15s}
.ftab.active{background:var(--red);color:#fff;border-color:var(--red)}
.picks-widget{background:var(--card);border-top:1px solid var(--border)}
.picks-toggle{width:100%;background:none;border:none;border-bottom:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;font-family:DM Sans,sans-serif}
.picks-toggle-left{display:flex;align-items:center;gap:10px}
.picks-toggle-title{font-family:Bebas Neue,sans-serif;font-size:17px;letter-spacing:.06em;color:var(--text)}
.picks-badge{background:var(--red);color:#fff;font-size:10px;font-weight:600;padding:2px 7px;border-radius:10px}
.picks-toggle-svg{width:14px;height:14px;transition:transform .2s;color:var(--muted);flex-shrink:0}
.picks-toggle.open .picks-toggle-svg{transform:rotate(180deg)}
.picks-body{display:none;padding:0 16px 16px}
.picks-body.open{display:block}
.picks-ev-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin:14px 0 8px;display:flex;align-items:center;gap:8px}
.picks-ev-label::after{content:"";flex:1;height:1px;background:var(--border)}
.pick-summary-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--border)}
.pick-summary-row:last-child{border-bottom:none}
.pick-fight-label{font-size:10px;color:var(--muted);flex-shrink:0;width:60px}
.pick-fighter-pick{font-size:13px;font-weight:500;flex:1;color:var(--text)}
.pick-result-badge{font-size:10px;font-weight:600;padding:2px 7px;border-radius:3px;flex-shrink:0}
.pick-result-badge.win{background:rgba(46,204,113,.1);color:var(--green);border:1px solid rgba(46,204,113,.2)}
.pick-result-badge.loss{background:rgba(232,25,44,.08);color:var(--red);border:1px solid rgba(232,25,44,.2)}
.pick-result-badge.pending{background:var(--pending-bg);color:var(--muted);border:1px solid var(--border)}
.picks-score-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0 4px;border-top:1px solid var(--border);margin-top:4px}
.picks-score-label{font-size:11px;color:var(--muted)}
.picks-score-val{font-family:Bebas Neue,sans-serif;font-size:20px;color:var(--red)}
.share-wrap{padding:0 16px 12px}
.share-btn-small{background:none;border:1px solid var(--border2);color:var(--muted);cursor:pointer;padding:6px 14px;border-radius:6px;font:500 11px DM Sans,sans-serif;transition:color .15s,border-color .15s}
.share-icon-btn{background:none;border:none;color:var(--muted);cursor:pointer;padding:10px 14px;display:flex;align-items:center;justify-content:center;transition:color .15s;flex-shrink:0}
.share-icon-btn:hover{color:var(--text)}
.ev-divider{display:flex;align-items:center;gap:10px;padding:16px 16px 0;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
.ev-divider::after{content:"";flex:1;height:1px;background:var(--border)}
.ev-band{border-top:3px solid var(--red);padding:14px 16px 12px}
.ev-band.ev-future{border-top-color:var(--future-border);background:var(--future-bg)}
.ev-num{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.12em;margin-bottom:4px}
.ev-name{font-family:Bebas Neue,sans-serif;font-size:22px;letter-spacing:.06em;line-height:1;margin-bottom:8px;color:var(--text)}
.ev-row{display:flex;flex-wrap:wrap;gap:4px 14px;margin-bottom:6px}
.ev-detail{font-size:11px;color:var(--muted2);display:flex;align-items:center;gap:3px}
.ev-detail svg{width:10px;height:10px;opacity:.5;flex-shrink:0}
.ev-badges{display:flex;gap:5px;flex-wrap:wrap}
.badge{font-size:9px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;padding:2px 7px;border-radius:3px}
.b-next{background:rgba(232,25,44,.15);color:var(--red);border:1px solid rgba(232,25,44,.3)}
.b-title{background:rgba(201,168,76,.12);color:var(--gold);border:1px solid rgba(201,168,76,.25)}
.b-ppv{background:var(--pill-bg);color:var(--muted2);border:1px solid var(--border)}
.fights-wrap{background:var(--card)}
.fight-row{padding:12px 16px;border-bottom:1px solid var(--border)}
.fight-row:last-child{border-bottom:none}
.fight-row.fmain{background:rgba(232,25,44,.03);border-left:3px solid var(--red);padding-left:13px}
.fight-row.fco{background:rgba(201,168,76,.02);border-left:3px solid var(--gold);padding-left:13px}
.fight-row.fcard{border-left:3px solid var(--stripe-border);padding-left:13px}
.fight-row.fpre{border-left:3px solid transparent;background:rgba(255,255,255,.01)}
.fight-row.fresult{border-left-color:var(--green)}
.fight-row.flive{border-left-color:var(--red)}
.flbl{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px}
.flbl.lmain{color:var(--red)}.flbl.lco{color:var(--gold)}.flbl.lpre{color:var(--muted)}
.mu{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.ft{display:flex;flex-direction:column;gap:1px;min-width:0}
.ft.ftr{align-items:flex-end;text-align:right}
.fn{font-family:Bebas Neue,sans-serif;font-size:24px;letter-spacing:.03em;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fn.fsm{font-size:19px}.fn.fxs{font-size:15px;font-family:DM Sans,sans-serif;font-weight:500}
.frec{font-size:12px;color:var(--muted2);margin-top:2px}
.fpills{display:flex;gap:3px;flex-wrap:wrap;margin-top:2px}
.ft.ftr .fpills{justify-content:flex-end}
.pchamp{font-size:9px;font-weight:600;padding:1px 5px;border-radius:2px;background:rgba(201,168,76,.1);color:var(--gold);border:1px solid rgba(201,168,76,.18)}
.prank{font-size:9px;font-weight:600;padding:1px 5px;border-radius:2px;background:var(--pill-bg);color:var(--muted2)}
.prank-nr{opacity:0.4}
.vc{display:flex;flex-direction:column;align-items:center;gap:2px;flex-shrink:0}
.vs{font-family:Bebas Neue,sans-serif;font-size:12px;color:var(--sep)}
.wcsm{font-size:8px;color:var(--muted);text-align:center;text-transform:uppercase;max-width:50px;line-height:1.3}
.stats-hint{font-size:9px;color:var(--muted);margin-top:2px}
.ft.ftr .stats-hint{text-align:right}
.ft-click{cursor:pointer}
.ft-click:hover .fn{opacity:.75}
.odds-row{display:flex;justify-content:space-between;margin-top:8px;padding-top:8px;border-top:1px solid var(--border)}
.odds-side{display:flex;flex-direction:column;gap:1px}
.odds-side.osr{align-items:flex-end}
.odds-nm{font-size:9px;color:var(--muted);text-transform:uppercase}
.odds-val{font-size:14px;font-weight:600}
.odds-val.fav{color:var(--green)}.odds-val.dog{color:#e05060}
.odds-ctr{font-size:9px;color:var(--muted);text-transform:uppercase;align-self:center}
.result-row{display:flex;align-items:center;justify-content:space-between;margin-top:8px;padding-top:8px;border-top:1px solid var(--border)}
.result-winner{font-size:12px;font-weight:600;color:var(--green);display:flex;align-items:center;gap:5px}
.result-method{font-size:11px;color:var(--muted);background:var(--card2);padding:2px 7px;border-radius:3px}
.result-live{font-size:11px;font-weight:600;color:var(--red);display:flex;align-items:center;gap:5px;animation:blink 1s infinite}
.pick-row{display:flex;align-items:center;gap:6px;margin-top:8px;padding-top:8px;border-top:1px solid var(--border)}
.pick-lbl{font-size:9px;color:var(--muted);text-transform:uppercase;flex-shrink:0}
.pick-btn{flex:1;padding:6px 8px;border-radius:5px;border:1px solid var(--border2);background:none;color:var(--muted2);font:500 12px DM Sans,sans-serif;cursor:pointer;transition:all .15s;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pick-btn.psel{background:rgba(232,25,44,.12);border-color:var(--red);color:var(--red)}
.pick-btn.pcorrect{background:rgba(46,204,113,.1);border-color:var(--green);color:var(--green)}
.pick-btn.pwrong{opacity:.4;text-decoration:line-through}
.more-btn{width:100%;background:var(--card2);border:none;border-top:1px solid var(--border);padding:9px 16px;display:flex;align-items:center;gap:6px;font-size:10px;color:var(--muted);cursor:pointer;font-family:DM Sans,sans-serif;letter-spacing:.06em;text-transform:uppercase;text-align:left}
.more-btn svg{width:12px;height:12px;transition:transform .2s;margin-left:auto;flex-shrink:0}
.more-btn.open svg{transform:rotate(180deg)}
.more-body{display:none}.more-body.open{display:block}
.cmp-btn-row{width:100%;background:none;border:none;border-top:1px solid var(--border);padding:7px 16px;font-size:10px;color:var(--muted);cursor:pointer;font-family:DM Sans,sans-serif;letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:center;justify-content:center;gap:5px;transition:color .15s}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:200;align-items:flex-end;justify-content:center}
.modal-bg.open{display:flex}
.modal{background:var(--surface);border:1px solid var(--border2);border-radius:14px 14px 0 0;padding:20px 18px 36px;width:100%;max-width:480px}
.modal-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:4px}
.modal-xbtn{background:var(--btn-bg);border:none;color:var(--muted2);cursor:pointer;font-size:16px;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.modal-name{font-family:Bebas Neue,sans-serif;font-size:26px;letter-spacing:.05em;line-height:1}
.modal-photo-row{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.modal-sub{font-size:12px;color:var(--muted);margin-bottom:14px}
.modal-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.ms{background:var(--card2);border-radius:8px;padding:10px 12px;border:1px solid var(--border)}
.ms-val{font-family:Bebas Neue,sans-serif;font-size:22px}
.ms-lbl{font-size:9px;color:var(--muted);text-transform:uppercase;margin-top:2px}
.mbar-wrap{margin-top:8px}
.mbar-lbl{font-size:10px;color:var(--muted);margin-bottom:4px;display:flex;justify-content:space-between}
.mbar{height:4px;background:var(--border);border-radius:2px;overflow:hidden}
.mbar-fill{height:100%;background:var(--red);border-radius:2px}
.cmp-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:250;align-items:center;justify-content:center;padding:20px}
.cmp-bg.open{display:flex}
.cmp-box{background:var(--surface);border:1px solid var(--border2);border-radius:12px;padding:18px 16px 24px;width:100%;max-width:480px;max-height:85vh;overflow-y:auto}
.cmp-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cmp-title{font-family:Bebas Neue,sans-serif;font-size:20px;letter-spacing:.06em}
.cmp-xbtn{background:var(--btn-bg);border:none;color:var(--muted2);cursor:pointer;font-size:16px;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.cmp-names{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;margin-bottom:16px}
.cmp-name{font-family:Bebas Neue,sans-serif;font-size:17px;letter-spacing:.04em;text-align:center}
.cmp-rec{font-size:11px;color:var(--muted2);margin-top:2px;text-align:center}
.cmp-vs{font-family:Bebas Neue,sans-serif;font-size:14px;color:var(--muted);align-self:center;text-align:center}
.cmp-row{display:flex;flex-direction:column;gap:4px;padding:10px 0;border-bottom:1px solid var(--border)}
.cmp-row:last-child{border-bottom:none}
.cmp-vals{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:center}
.cmp-val{font-size:14px;font-weight:600;color:var(--text)}
.cmp-val.win{color:var(--green)}
.cmp-val.cvr{text-align:right}
.cmp-stat-lbl{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;text-align:center}
.cmp-bar-wrap{position:relative;height:8px;background:var(--bar-bg);border-radius:4px;overflow:hidden;width:100%}
.cmp-bar-l{position:absolute;left:0;top:0;height:100%;background:#e8192c;border-radius:4px}
.cmp-bar-r{position:absolute;right:0;top:0;height:100%;background:#c9a84c;border-radius:4px}
.fn-mode{display:none;position:fixed;inset:0;background:#000;z-index:300;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
.fn-mode.open{display:flex}
.fn-close{position:absolute;top:16px;right:16px;background:rgba(255,255,255,.08);border:none;color:#fff;width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center}
.fn-ev{font-family:Bebas Neue,sans-serif;font-size:16px;letter-spacing:.12em;color:rgba(255,255,255,.35);margin-bottom:4px}
.fn-wc{font-size:11px;color:rgba(255,255,255,.28);text-transform:uppercase;margin-bottom:28px}
.fn-mu{display:flex;align-items:center;justify-content:center;gap:16px;width:100%;flex-wrap:wrap}
.fn-ft{flex:1;min-width:100px}
.fn-ft.fnr{text-align:right}
.fn-nm{font-family:Bebas Neue,sans-serif;font-size:clamp(26px,7vw,52px);line-height:1.1;color:#fff}
.fn-rc{font-size:13px;color:rgba(255,255,255,.38);margin-top:4px}
.fn-vs{font-family:Bebas Neue,sans-serif;font-size:20px;color:rgba(255,255,255,.12);flex-shrink:0}
.fn-nav{display:flex;gap:10px;margin-top:28px}
.fn-nb{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);color:rgba(255,255,255,.55);padding:8px 18px;border-radius:6px;cursor:pointer;font:500 12px DM Sans,sans-serif;display:flex;align-items:center;gap:5px}
.fn-ctr{font-size:10px;color:rgba(255,255,255,.25);margin-top:12px}
.nm-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:400;align-items:center;justify-content:center;padding:20px}
.nm-bg.open{display:flex}
.nm-box{background:var(--surface);border:1px solid var(--border2);border-radius:12px;padding:24px 20px;width:100%;max-width:320px}
.nm-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:6px}
.nm-xbtn{background:var(--btn-bg);border:none;color:var(--muted2);cursor:pointer;font-size:16px;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.nm-box h3{font-family:Bebas Neue,sans-serif;font-size:22px}
.nm-box p{font-size:12px;color:var(--muted);margin-bottom:14px;line-height:1.55}
.nm-input{width:100%;background:var(--card2);border:1px solid var(--border2);color:var(--text);padding:10px 12px;border-radius:7px;font:500 14px DM Sans,sans-serif;margin-bottom:10px}
.nm-input:focus{outline:none;border-color:var(--red)}
.nm-btn{width:100%;background:var(--red);border:none;color:#fff;padding:10px;border-radius:7px;font:600 13px DM Sans,sans-serif;cursor:pointer}
.share-modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:250;align-items:center;justify-content:center;padding:20px}
.share-modal-bg.open{display:flex}
.share-modal-box{background:var(--surface);border:1px solid var(--border2);border-radius:12px;padding:20px;width:100%;max-width:360px}
.share-modal-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.share-modal-title{font-family:Bebas Neue,sans-serif;font-size:18px;letter-spacing:.06em}
.share-modal-xbtn{background:var(--btn-bg);border:none;color:var(--muted2);cursor:pointer;font-size:16px;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.share-card{background:var(--bg);border:1px solid var(--border2);border-radius:8px;padding:14px;margin-bottom:14px}
.share-card-title{font-family:Bebas Neue,sans-serif;font-size:16px;letter-spacing:.06em;color:var(--red);margin-bottom:10px}
.share-row{display:flex;justify-content:space-between;font-size:12px;padding:3px 0;border-bottom:1px solid var(--border)}
.share-row:last-child{border-bottom:none}
.share-btns{display:flex;gap:8px}
.share-copy-btn{flex:1;padding:10px;border-radius:7px;border:1px solid var(--border2);background:none;color:var(--text);font:600 12px DM Sans,sans-serif;cursor:pointer}
.share-done-btn{flex:1;padding:10px;border-radius:7px;background:var(--red);border:none;color:#fff;font:600 12px DM Sans,sans-serif;cursor:pointer}
.notif-btn{position:fixed;bottom:24px;right:16px;background:var(--red);border:none;color:#fff;width:48px;height:48px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(232,25,44,.4);z-index:50}
.notif-btn svg{width:20px;height:20px}
.notif-btn.active{background:var(--green)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--surface);border:1px solid var(--border2);color:var(--text);padding:10px 18px;border-radius:8px;font-size:12px;z-index:500;transition:transform .25s ease;white-space:nowrap;pointer-events:none}
.toast.show{transform:translateX(-50%) translateY(0)}
@media(min-width:420px){.fn{font-size:26px}.fn.fsm{font-size:21px}}
.search-input{background:none;border:1px solid var(--border);color:var(--text);padding:4px 10px;border-radius:20px;font:500 11px DM Sans,sans-serif;outline:none;width:130px;flex-shrink:0}
.search-input::placeholder{color:var(--muted)}
.ft-photo{width:40px;height:40px;border-radius:50%;border:2px solid var(--border);margin-bottom:4px;overflow:hidden;flex-shrink:0}
.ft.ftr .ft-photo{align-self:flex-end}
.parlay-wrap{border-top:1px solid var(--border);margin-top:4px;padding:10px 0 4px;display:flex;justify-content:space-between;align-items:center}
.parlay-lbl{font-size:11px;color:var(--muted)}
.parlay-val{font-family:Bebas Neue,sans-serif;font-size:16px;color:var(--gold)}
.form-strip{display:flex;gap:3px;flex-wrap:wrap;margin-top:3px}
.form-pill{font-size:8px;font-weight:700;padding:1px 4px;border-radius:2px;letter-spacing:.04em}
.form-w{background:rgba(46,204,113,.12);color:var(--green);border:1px solid rgba(46,204,113,.2)}
.form-l{background:rgba(232,25,44,.08);color:#e05060;border:1px solid rgba(232,25,44,.18)}
.form-d{background:rgba(255,255,255,.07);color:var(--muted2);border:1px solid var(--border)}
.fin-hint{font-size:9px;color:var(--muted);margin-top:1px}
.method-pick-row{display:flex;align-items:center;gap:6px;padding:4px 16px 6px;border-top:1px solid var(--border)}
.conf-row{display:flex;align-items:center;gap:5px;padding:2px 16px 8px}
.conf-lbl{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-right:2px}
.conf-star{background:none;border:none;cursor:pointer;font-size:16px;padding:0 1px;line-height:1}
.fotn-row{background:var(--card2);border-top:1px solid var(--border);padding:9px 16px;display:flex;align-items:center;gap:10px}
.fotn-lbl{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;flex-shrink:0}
.fotn-sel{background:var(--card);border:1px solid var(--border2);color:var(--text);padding:4px 8px;border-radius:5px;font:500 11px DM Sans,sans-serif;flex:1;max-width:180px}
.streak-badge{background:rgba(201,168,76,.15);color:var(--gold);border:1px solid rgba(201,168,76,.25);font-size:10px;font-weight:600;padding:2px 7px;border-radius:10px}
.arch-hdr{display:flex;align-items:center;gap:10px;padding:16px 16px 0;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;cursor:pointer;user-select:none}
.arch-hdr::after{content:"";flex:1;height:1px;background:var(--border)}
.share-badge{background:linear-gradient(135deg,var(--red),#900);border-radius:8px;padding:14px;margin-bottom:12px;text-align:center}
.share-badge-num{font-family:Bebas Neue,sans-serif;font-size:42px;color:#fff;line-height:1}
.share-badge-sub{font-size:11px;color:rgba(255,255,255,.75);margin-top:2px}

</style>

function updateCountdown(){
  var now=Date.now();
  var upcoming=EVENTS.filter(function(e){return new Date(e.date)>=now-2*864e5;});
  if(!upcoming.length)return;
  // Skip events that ended more than 6 hours ago (main card ~4hrs, buffer)
  var ev=upcoming[0];
  var dp0=ev.date.split("-");var p0=(ev.time||"0:0").split(":");
  var t0=Date.UTC(parseInt(dp0[0],10),parseInt(dp0[1],10)-1,parseInt(dp0[2],10),parseInt(p0[0],10)+4,parseInt(p0[1]||"0",10),0);
  if(now-t0>12*36e5&&upcoming.length>1){ev=upcoming[1];}
  var p=ev.time.split(":");var h=parseInt(p[0],10);var m=parseInt(p[1]||"0",10);
  var dp=ev.date.split("-");
  var target=Date.UTC(parseInt(dp[0],10),parseInt(dp[1],10)-1,parseInt(dp[2],10),h+4,m,0);
  var diff=target-now;
  var wrap=document.getElementById("cd-wrap");
  if(!wrap)return;
  wrap.style.display="block";
  document.getElementById("cd-event").textContent=ev.name;
  var timer=document.getElementById("cd-timer");
  timer.innerHTML="";
  if(diff<=0){
    var live=document.createElement("span");live.className="cd-live";live.textContent="MAIN CARD LIVE NOW";timer.appendChild(live);return;
  }
  var days=Math.floor(diff/864e5);var hours=Math.floor((diff%864e5)/36e5);
  var mins=Math.floor((diff%36e5)/6e4);var secs=Math.floor((diff%6e4)/1e3);
  function cdUnit(val,lbl){var u=document.createElement("div");u.className="cd-unit";var n=document.createElement("div");n.className="cd-num";n.textContent=val;var l=document.createElement("div");l.className="cd-lbl";l.textContent=lbl;u.appendChild(n);u.appendChild(l);return u;}
  function cdSep(){var s=document.createElement("div");s.className="cd-sep";s.textContent=":";return s;}
  if(days>0){timer.appendChild(cdUnit(days,"Days"));timer.appendChild(cdSep());}
  timer.appendChild(cdUnit(pad(hours),"Hrs"));timer.appendChild(cdSep());
  timer.appendChild(cdUnit(pad(mins),"Min"));timer.appendChild(cdSep());
  timer.appendChild(cdUnit(pad(secs),"Sec"));
}

function checkNotifSchedule(){
  if(!notifActive||Notification.permission!=="granted")return;

    function evTime(t){var p=(t||"0:0").split(":");return Date.UTC(+dp[0],+dp[1]-1,+dp[2],+p[0]+4,+(p[1]||0),0);}
    var mainT=evTime(ev.time);var diff=mainT-now;
    if(diff>0&&diff<=36e5&&!ev._notifMain){ev._notifMain=true;setTimeout(function(){fireNotif("UFC Main Card Starting",ev.name+" main card begins in 30 min!");},Math.max(0,diff-30*6e4));}

  });

  var dOpt=document.createElement("option");dOpt.value="";dOpt.textContent="Performance/Fight Night...";fotSel.appendChild(dOpt);
  var evFs=[];ev.fights.forEach(function(f){evFs.push(f.f1.n,f.f2.n);});
  evFs.forEach(function(fn){var o=document.createElement("option");o.value=fn;o.textContent=fn.split(" ").pop();if(fn===fotPick)o.selected=true;fotSel.appendChild(o);});
  (function(fk){fotSel.onchange=function(){preds_fotn[fk]=fotSel.value;saveFOTN();if(fotSel.value)toast("Bonus: "+fotSel.value.split(" ").pop());};})(fotKey);
  fotRow.appendChild(fotSel);
  fw.appendChild(fotRow);
  frag.appendChild(fw);
  return frag;
}

function updatePicksWidget(){
  var total=Object.keys(preds).length;
  var widget=document.getElementById("picksWidget");
  var badge=document.getElementById("picksBadge");
  if(widget)widget.style.display=total>0?"block":"none";
  if(badge)badge.textContent=total;
  var streak=computeStreak();
  var sb=document.getElementById("streakBadge");
  if(sb){sb.textContent=streak>=2?streak+" in a row":"";sb.style.display=streak>=2?"":"none";}
  var body=document.getElementById("picksBody");
  if(body&&body.classList.contains("open"))renderPicksWidget();
}

function renderPicksWidget(){
  var body=document.getElementById("picksBody");if(!body)return;
  body.innerHTML="";
  var total=Object.keys(preds).length;
  if(!total){var e=document.createElement("p");e.style.cssText="font-size:13px;color:var(--muted);padding:12px 0";e.textContent="No picks yet.";body.appendChild(e);return;}
  var correct=0,resolved=0;
  var now=Date.now();

  // Split events into upcoming (has pending picks) and completed (all resolved)
  var upcomingEvs=[];var completedEvs=[];
  EVENTS.forEach(function(ev,ei){
    var eps=ev.fights.map(function(f){var k=pk(ev,f);return preds[k]?{fight:f,pick:preds[k],result:f.winner||""}:null;}).filter(Boolean);
    if(!eps.length)return;
    var hasPending=eps.some(function(p){return !p.result;});
    var evDate=new Date(ev.date).getTime();
    var isOld=evDate<now-2*864e5;
    if(isOld||!hasPending){completedEvs.push({ev:ev,ei:ei,eps:eps});}
    else{upcomingEvs.push({ev:ev,ei:ei,eps:eps});}
  });

  function makePickRow(p,ei,showUndo){
    var row=document.createElement("div");row.className="pick-summary-row";
    var fl=document.createElement("div");fl.className="pick-fight-label";
    fl.textContent=p.fight.lbl==="Main Event"?"Main":p.fight.lbl==="Co-Main"?"Co-Main":p.fight.wc;row.appendChild(fl);
    var pn=document.createElement("div");pn.className="pick-fighter-pick";pn.textContent=p.pick.split(" ").pop();row.appendChild(pn);
    var opp=document.createElement("div");opp.style.cssText="font-size:11px;color:var(--muted);flex-shrink:0";
    var oppName=p.pick===p.fight.f1.n?p.fight.f2.n:p.fight.f1.n;
    opp.textContent="vs "+oppName.split(" ").pop();row.appendChild(opp);
    if(p.fight.odds){
      var pickedF1=p.pick===p.fight.f1.n;
      var pickedOdds=pickedF1?p.fight.odds.f1:p.fight.odds.f2;
      var isFav=pickedOdds<0;
      var ob=document.createElement("div");
      ob.style.cssText="font-size:9px;font-weight:600;padding:1px 5px;border-radius:3px;flex-shrink:0;"+(isFav?"background:rgba(46,204,113,.08);color:var(--green);border:1px solid rgba(46,204,113,.2)":"background:rgba(232,25,44,.08);color:var(--red);border:1px solid rgba(232,25,44,.2)");
      ob.textContent=(isFav?"FAV ":"DOG ")+(pickedOdds>0?"+":"")+pickedOdds;row.appendChild(ob);
    }
    var bdg=document.createElement("div");bdg.className="pick-result-badge";
    if(!p.result){bdg.className+=" pending";bdg.textContent="Pending";}
    else if(p.result===p.pick){
      bdg.className+=" win";bdg.textContent="Correct";correct++;resolved++;
      if(ei>=0){var rk=pk(EVENTS[ei],p.fight);resolvedPicks[rk]="win";try{localStorage.setItem("ufc_resolved",JSON.stringify(resolvedPicks));}catch(e){}}
    } else {
      bdg.className+=" loss";bdg.textContent="Wrong";resolved++;
      if(ei>=0){var rk=pk(EVENTS[ei],p.fight);resolvedPicks[rk]="loss";try{localStorage.setItem("ufc_resolved",JSON.stringify(resolvedPicks));}catch(e){}}
    }
    row.appendChild(bdg);
    if(showUndo&&!p.result){
      var ub=document.createElement("button");
      ub.style.cssText="background:none;border:none;color:var(--muted);cursor:pointer;padding:2px 6px;font-size:14px;flex-shrink:0";
      ub.textContent="x";
      (function(ev2,fight2){ub.onclick=function(e2){e2.stopPropagation();undoPick(ev2,fight2);};})(EVENTS[ei],p.fight);
      row.appendChild(ub);
    }
    return row;
  }

  function makeEvSection(ev,ei,eps,showUndo){
    var lbl=document.createElement("div");lbl.className="picks-ev-label";lbl.textContent=ev.name;body.appendChild(lbl);
    eps.forEach(function(p){body.appendChild(makePickRow(p,ei,showUndo));});
  }

  // Upcoming picks first
  upcomingEvs.forEach(function(item){makeEvSection(item.ev,item.ei,item.eps,true);});

  // Collect pick keys matched by current EVENTS
  var matchedKeys=new Set();
  upcomingEvs.forEach(function(item){item.eps.forEach(function(p){matchedKeys.add(pk(item.ev,p.fight));});});
  completedEvs.forEach(function(item){item.eps.forEach(function(p){matchedKeys.add(pk(item.ev,p.fight));});});

  // Orphaned picks: stored in preds but not in current EVENTS (old completed events)
  var orphanGroups={};
  Object.keys(preds).forEach(function(k){
    if(matchedKeys.has(k))return;
    var parts=k.split("|");
    if(parts.length<3)return;
    var date=parts[0],f1n=parts[1],f2n=parts[2];
    if(!orphanGroups[date])orphanGroups[date]={date:date,rows:[]};
    orphanGroups[date].rows.push({f1n:f1n,f2n:f2n,pick:preds[k],key:k});
  });
  var orphanList=Object.values(orphanGroups).sort(function(a,b){return b.date.localeCompare(a.date);});
  completedEvs=completedEvs.concat(orphanList.map(function(g){return {ev:{name:g.date,date:g.date},ei:-1,eps:g.rows.map(function(r){return {fight:{lbl:"",wc:"",f1:{n:r.f1n},f2:{n:r.f2n},odds:null,winner:"",_key:r.key},pick:r.pick,result:""};}),isOrphan:true};}));

  // Completed + historical section - collapsible
  if(completedEvs.length){
    var compHdr=document.createElement("div");
    compHdr.style.cssText="display:flex;align-items:center;gap:8px;padding:14px 0 8px;cursor:pointer";
    var compLbl=document.createElement("div");
    compLbl.style.cssText="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;flex:1";
    compLbl.textContent="Completed Events";
    var compLine=document.createElement("div");compLine.style.cssText="flex:1;height:1px;background:var(--border)";
    var compArrow=document.createElement("span");compArrow.style.cssText="font-size:10px;color:var(--muted);transition:transform .2s";
    compArrow.textContent="▼";
    compHdr.appendChild(compLbl);compHdr.appendChild(compLine);compHdr.appendChild(compArrow);
    var startOpen=!upcomingEvs.length;
    var compBody=document.createElement("div");compBody.style.display=startOpen?"block":"none";
    if(startOpen)compArrow.style.transform="rotate(180deg)";
    compHdr.onclick=function(){
      var open=compBody.style.display!=="none";
      compBody.style.display=open?"none":"block";
      compArrow.style.transform=open?"":"rotate(180deg)";
    };
    body.appendChild(compHdr);body.appendChild(compBody);
    completedEvs.forEach(function(item){
      if(item.isOrphan){
        // Orphaned picks from old events — parse date for label
        var d=item.ev.date;try{d=new Date(d).toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"});}catch(e){}
        var lbl=document.createElement("div");lbl.className="picks-ev-label";lbl.textContent=d;compBody.appendChild(lbl);
        item.eps.forEach(function(p){
          var row=document.createElement("div");row.className="pick-summary-row";
          var pn=document.createElement("div");pn.className="pick-fighter-pick";pn.textContent=p.pick.split(" ").pop();row.appendChild(pn);
          var opp=document.createElement("div");opp.style.cssText="font-size:11px;color:var(--muted);flex-shrink:0";
          var oppName=p.pick===p.fight.f1.n?p.fight.f2.n:p.fight.f1.n;
          opp.textContent="vs "+oppName.split(" ").pop();row.appendChild(opp);
          var outcome=resolvedPicks[p.fight._key];
          var bdg=document.createElement("div");bdg.className="pick-result-badge";
          if(outcome==="win"){bdg.className+=" win";bdg.textContent="Correct";correct++;resolved++;}
          else if(outcome==="loss"){bdg.className+=" loss";bdg.textContent="Wrong";resolved++;}
          else{bdg.className+=" pending";bdg.textContent="Past";}
          row.appendChild(bdg);
          compBody.appendChild(row);
        });
      } else {
        var lbl=document.createElement("div");lbl.className="picks-ev-label";lbl.textContent=item.ev.name;compBody.appendChild(lbl);
        item.eps.forEach(function(p){compBody.appendChild(makePickRow(p,item.ei,false));});
      }
    });
  }

  // Parlay calculator for pending picks with odds
  var parlayOdds=[];
  upcomingEvs.forEach(function(item){
    item.eps.forEach(function(p){
      if(!p.result&&p.fight.odds){
        var o=p.pick===p.fight.f1.n?p.fight.odds.f1:p.fight.odds.f2;
        parlayOdds.push(o);
      }
    });
  });
  if(parlayOdds.length>1){
    var mult=1;
    parlayOdds.forEach(function(o){mult*=o>0?1+o/100:1-100/o;});
    var profit=Math.round((mult-1)*10*100)/100;
    var pw=document.createElement("div");pw.className="parlay-wrap";
    var pl=document.createElement("span");pl.className="parlay-lbl";pl.textContent="Parlay ("+parlayOdds.length+" picks) on $10";
    var pv=document.createElement("span");pv.className="parlay-val";pv.textContent="$"+profit.toFixed(2)+" profit";
    pw.appendChild(pl);pw.appendChild(pv);body.appendChild(pw);
  }

  if(resolved>0){
    var sr=document.createElement("div");sr.className="picks-score-row";
    var sl=document.createElement("span");sl.className="picks-score-label";sl.textContent="Overall record";
    var sv=document.createElement("span");sv.className="picks-score-val";
    sv.textContent=correct+"/"+resolved+" ("+Math.round(correct/resolved*100)+"%)";
    sr.appendChild(sl);sr.appendChild(sv);body.appendChild(sr);
  }
}

function togglePicks(){
  var body=document.getElementById("picksBody");var toggle=document.getElementById("picksToggle");
  body.classList.toggle("open");toggle.classList.toggle("open");
  if(body.classList.contains("open"))renderPicksWidget();
}

function render(){
  buildReg();
  var now=Date.now();
  var events=EVENTS.filter(function(e){return new Date(e.date)>=now-2*864e5&&new Date(e.date)<=now+864e5*65;}).sort(function(a,b){return new Date(a.date)-new Date(b.date);});
  var pastEvs=EVENTS.filter(function(e){return new Date(e.date)<now-2*864e5&&e.fights.some(function(f){return f.state==="post";});}).sort(function(a,b){return new Date(b.date)-new Date(a.date);});
  var vis=events.filter(function(e){return e.fights.some(matchFilter);});
  var app=document.getElementById("app");
  if(!app)return;
  app.innerHTML="";
  if(!vis.length){
    var msg=document.createElement("div");msg.style.cssText="padding:32px 16px;text-align:center;color:var(--muted);font-size:13px";msg.textContent="No fights in this weight class.";app.appendChild(msg);
  } else {
    var now2=Date.now();
    var featIdx=-1;
    vis.forEach(function(ev,i){if(featIdx===-1&&new Date(ev.date).getTime()>=now2-864e5)featIdx=i;});
    if(featIdx===-1)featIdx=0;
    vis.forEach(function(ev,i){var ei=EVENTS.indexOf(ev);app.appendChild(makeEventBlock(ev,ei,i,vis.length,i===featIdx));});
  }
  // Compute stats dynamically from visible events only
  var allFights=vis.reduce(function(a,e){return a.concat(e.fights||[]);}, []);
  var titleFights=allFights.filter(function(f){return f.title;});
  var sevEl=document.getElementById("sev");var stiEl=document.getElementById("sti");var sboEl=document.getElementById("sbo");
  if(sevEl)sevEl.textContent=vis.length;
  if(stiEl)stiEl.textContent=titleFights.length;
  if(sboEl)sboEl.textContent=allFights.length;
  document.getElementById("picks-count").textContent=Object.keys(preds).length;
  // Show the date of the most recently completed event as "data freshness"
  var ud=document.getElementById("updateDate");
  if(ud){
    var latestEv=null;
    EVENTS.forEach(function(ev){if(ev.fights.some(function(f){return f.state==="post";}))latestEv=ev;});
    ud.textContent=latestEv?fmtDate(latestEv.date):"—";
  }
  if(pastEvs.length&&curFilter==="all"&&!curSearch){
    var archHdr=document.createElement("div");archHdr.className="arch-hdr";
    var archArrow=document.createElement("span");archArrow.style.cssText="font-size:10px;margin-right:4px;transition:transform .2s;display:inline-block";archArrow.textContent="▶";
    archHdr.appendChild(archArrow);archHdr.appendChild(document.createTextNode("Past Results ("+pastEvs.length+")"));
    var archBody=document.createElement("div");archBody.style.display="none";
    archHdr.onclick=function(){var open=archBody.style.display!=="none";archBody.style.display=open?"none":"block";archArrow.style.transform=open?"":"rotate(90deg)";};
    app.appendChild(archHdr);app.appendChild(archBody);
    pastEvs.forEach(function(ev,i){var ei=EVENTS.indexOf(ev);archBody.appendChild(makeEventBlock(ev,ei,i,pastEvs.length,false));});
  }
  updatePicksWidget();
  updateCountdown();
  checkFightNight();
}


document.addEventListener("DOMContentLoaded",function(){
  try{render();}
  catch(e){
    var app=document.getElementById("app");
    if(app){
      app.style.cssText="padding:20px;background:#1a0000;color:#ff6666;font-family:monospace;font-size:12px;white-space:pre-wrap";
      app.textContent="JS ERROR IN render():\n"+e.message+"\n\n"+e.stack;
    }
  }

});
</script>
</body>
