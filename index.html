<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UFC Fight Cards</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--red:#e8192c;--gold:#c9a84c;--bg:#0d0d0d;--card:#161616;--card2:#1e1e1e;--border:rgba(255,255,255,.08);--border2:rgba(255,255,255,.15);--text:#f0f0f0;--muted:#777;--muted2:#aaa;--green:#2ecc71}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;padding-bottom:60px;font-size:15px}

/* Header */
.hdr{display:flex;align-items:center;justify-content:space-between;padding:0 16px;height:52px;border-bottom:1px solid var(–border);background:rgba(13,13,13,.97);backdrop-filter:blur(8px);position:sticky;top:0;z-index:99}
.logo{display:flex;align-items:center;gap:8px}
.logo-hex{width:28px;height:28px;background:var(–red);clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);display:flex;align-items:center;justify-content:center;font-family:‘Bebas Neue’,sans-serif;font-size:10px;color:#fff;flex-shrink:0}
.logo-text{font-family:‘Bebas Neue’,sans-serif;font-size:22px;letter-spacing:.08em}
.logo-text span{color:var(–red)}
.hdr-right{display:flex;align-items:center;gap:8px}
.btn-tv{background:var(–card2);border:1px solid var(–border2);color:var(–muted2);width:34px;height:34px;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:color .15s,border-color .15s;flex-shrink:0}
.btn-tv:hover{color:var(–text);border-color:rgba(255,255,255,.3)}
.btn-tv svg{width:16px;height:16px}
.btn-ufc{background:var(–red);border:none;color:#fff;padding:6px 10px;border-radius:6px;font:600 11px ‘DM Sans’,sans-serif;cursor:pointer;text-decoration:none;display:flex;align-items:center;gap:3px}
.btn-ufc:hover{background:#c9101f}

/* Hero */
.hero{padding:18px 16px 14px;border-bottom:1px solid var(–border)}
.hero h1{font-family:‘Bebas Neue’,sans-serif;font-size:32px;letter-spacing:.07em;line-height:1}
.hero h1 span{color:var(–red)}
.hero-sub{font-size:11px;color:var(–muted);margin-top:4px}

/* Countdown */
.cd-wrap{margin-top:12px;background:var(–card2);border:1px solid var(–border);border-radius:8px;padding:10px 14px}
.cd-label{font-size:9px;color:var(–muted);text-transform:uppercase;letter-spacing:.1em;margin-bottom:4px}
.cd-event{font-size:12px;font-weight:600;color:var(–text);margin-bottom:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cd-timer{display:flex;align-items:flex-end;gap:2px}
.cd-unit{text-align:center;min-width:44px}
.cd-num{font-family:‘Bebas Neue’,sans-serif;font-size:30px;letter-spacing:.04em;line-height:1;color:var(–red)}
.cd-lbl{font-size:9px;color:var(–muted);text-transform:uppercase;letter-spacing:.07em}
.cd-sep{font-family:‘Bebas Neue’,sans-serif;font-size:24px;color:rgba(255,255,255,.2);padding-bottom:4px;margin:0 2px}
.cd-live{display:inline-block;background:rgba(232,25,44,.15);color:var(–red);border:1px solid rgba(232,25,44,.3);font-size:12px;font-weight:600;padding:5px 12px;border-radius:4px;letter-spacing:.05em}

/* Stats strip */
.stats{display:grid;grid-template-columns:repeat(4,1fr);background:var(–card);border-bottom:1px solid var(–border)}
.stat{padding:12px 6px;text-align:center;border-right:1px solid var(–border)}
.stat:last-child{border-right:none}
.sv{font-family:‘Bebas Neue’,sans-serif;font-size:24px;letter-spacing:.05em;line-height:1}
.sl{font-size:9px;color:var(–muted);text-transform:uppercase;letter-spacing:.08em;margin-top:2px}

/* Weight class filter tabs */
.tabs{display:flex;border-bottom:1px solid var(–border);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:9px 14px;font-size:11px;font-weight:600;color:var(–muted);border:none;background:none;cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;letter-spacing:.03em;transition:color .15s;flex-shrink:0}
.tab.on{color:var(–text);border-bottom-color:var(–red)}
.tab:hover{color:var(–muted2)}

/* Content */
.content{padding:14px 12px}
.sec-lbl{font-size:10px;color:var(–muted);text-transform:uppercase;letter-spacing:.1em;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.sec-lbl::after{content:’’;flex:1;height:1px;background:var(–border)}

/* Event card */
.evcard{background:var(–card);border:1px solid var(–border);border-radius:10px;overflow:hidden;margin-bottom:10px;animation:up .3s ease both}
.evcard.featured{border-color:var(–red)}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.evcard:nth-child(2){animation-delay:.06s}.evcard:nth-child(3){animation-delay:.12s}.evcard:nth-child(4){animation-delay:.18s}

/* Event header */
.ev-hdr{padding:12px 14px 10px;border-bottom:1px solid var(–border)}
.ev-name{font-family:‘Bebas Neue’,sans-serif;font-size:17px;letter-spacing:.06em;line-height:1;margin-bottom:6px}
.ev-meta{display:flex;flex-wrap:wrap;gap:4px 14px}
.ev-detail{font-size:11px;color:var(–muted);display:flex;align-items:center;gap:3px}
.ev-detail svg{width:10px;height:10px;opacity:.45;flex-shrink:0}
.badges{display:flex;gap:4px;margin-top:7px;flex-wrap:wrap}
.badge{font-size:9px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:2px 6px;border-radius:3px}
.b-next{background:rgba(232,25,44,.12);color:var(–red);border:1px solid rgba(232,25,44,.25)}
.b-title{background:rgba(201,168,76,.1);color:var(–gold);border:1px solid rgba(201,168,76,.2)}
.b-ppv{background:rgba(255,255,255,.05);color:var(–muted);border:1px solid var(–border)}

/* Fight rows */
.fight{padding:12px 14px;border-bottom:1px solid var(–border)}
.fight:last-of-type{border-bottom:none}
.flbl{font-size:9px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;margin-bottom:9px}
.flbl.main{color:var(–red)}.flbl.co{color:var(–gold)}.flbl.pre{color:var(–muted)}

/* Matchup grid */
.mu{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.ft{display:flex;flex-direction:column;gap:2px;min-width:0}
.ft.r{align-items:flex-end;text-align:right}
.fn{font-family:‘Bebas Neue’,sans-serif;font-size:20px;letter-spacing:.03em;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fn.sm{font-size:16px}.fn.xs{font-size:13px;font-family:‘DM Sans’,sans-serif;font-weight:500}
.frec{font-size:11px;color:var(–muted2)}
.fpills{display:flex;gap:3px;margin-top:2px}
.ft.r .fpills{justify-content:flex-end}
.pchamp{font-size:9px;font-weight:600;padding:1px 5px;border-radius:2px;background:rgba(201,168,76,.1);color:var(–gold);border:1px solid rgba(201,168,76,.18);letter-spacing:.06em}
.prank{font-size:9px;font-weight:600;padding:1px 5px;border-radius:2px;background:rgba(255,255,255,.06);color:var(–muted2);letter-spacing:.05em}
.vc{display:flex;flex-direction:column;align-items:center;gap:2px;flex-shrink:0}
.vs{font-family:‘Bebas Neue’,sans-serif;font-size:13px;color:rgba(255,255,255,.16);letter-spacing:.08em}
.wc-lbl{font-size:9px;color:var(–muted);text-align:center;text-transform:uppercase;letter-spacing:.04em;line-height:1.3;max-width:58px}

/* Stats tap hint */
.stats-hint{font-size:9px;color:rgba(255,255,255,.2);margin-top:2px}

/* Odds */
.odds-row{display:flex;justify-content:space-between;padding:6px 0 0}
.odds-pill{font-size:10px;font-weight:600;padding:2px 7px;border-radius:3px}
.odds-fav{background:rgba(46,204,113,.08);color:var(–green);border:1px solid rgba(46,204,113,.18)}
.odds-dog{background:rgba(232,25,44,.07);color:rgba(232,25,44,.7);border:1px solid rgba(232,25,44,.18)}
.odds-lbl{font-size:9px;color:var(–muted);align-self:center}

/* Predict row */
.pred-row{display:flex;align-items:center;gap:6px;padding:8px 14px;border-top:1px solid var(–border);background:rgba(255,255,255,.015)}
.pred-lbl{font-size:9px;color:var(–muted);text-transform:uppercase;letter-spacing:.07em;white-space:nowrap}
.pred-btn{flex:1;padding:6px 4px;border-radius:6px;border:1px solid var(–border2);background:none;color:var(–muted2);font:500 11px ‘DM Sans’,sans-serif;cursor:pointer;transition:all .15s;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pred-btn:hover{border-color:rgba(255,255,255,.3);color:var(–text)}
.pred-btn.sel{background:rgba(232,25,44,.1);border-color:var(–red);color:var(–red)}
.pred-btn.win{background:rgba(46,204,113,.08);border-color:var(–green);color:var(–green)}
.pred-btn.lose{opacity:.45;text-decoration:line-through}

/* More fights toggle */
.pbtn{width:100%;background:none;border:none;border-top:1px solid var(–border);padding:9px 14px;display:flex;align-items:center;gap:6px;font-size:10px;color:var(–muted);cursor:pointer;font-family:‘DM Sans’,sans-serif;letter-spacing:.06em;text-transform:uppercase;transition:color .15s,background .15s;text-align:left}
.pbtn:hover{color:var(–muted2);background:rgba(255,255,255,.02)}
.pbtn svg{width:12px;height:12px;transition:transform .2s;margin-left:auto;flex-shrink:0}
.pbtn.open svg{transform:rotate(180deg)}
.pbody{display:none;border-top:1px solid var(–border)}.pbody.open{display:block}

/* Fighter stats modal */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:200;align-items:flex-end;justify-content:center}
.modal-bg.open{display:flex}
.modal{background:#1c1c1c;border:1px solid var(–border2);border-radius:14px 14px 0 0;padding:20px 18px 36px;width:100%;max-width:480px;animation:slideUp .2s ease}
@keyframes slideUp{from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-close{float:right;background:none;border:none;color:var(–muted);cursor:pointer;font-size:22px;line-height:1}
.modal-fighter{font-family:‘Bebas Neue’,sans-serif;font-size:26px;letter-spacing:.04em;margin-bottom:2px}
.modal-sub{font-size:12px;color:var(–muted);margin-bottom:16px}
.modal-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.mstat{background:var(–card2);border-radius:8px;padding:10px 12px}
.mstat-val{font-family:‘Bebas Neue’,sans-serif;font-size:22px;letter-spacing:.04em}
.mstat-lbl{font-size:10px;color:var(–muted);text-transform:uppercase;letter-spacing:.06em;margin-top:1px}
.mbar-wrap{margin-bottom:10px}
.mbar-lbl{font-size:10px;color:var(–muted);margin-bottom:4px;display:flex;justify-content:space-between}
.mbar{height:4px;background:rgba(255,255,255,.08);border-radius:2px;overflow:hidden}
.mbar-fill{height:100%;background:var(–red);border-radius:2px}

/* Fight night mode */
.fn-mode{display:none;position:fixed;inset:0;background:#000;z-index:300;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
.fn-mode.open{display:flex}
.fn-close{position:absolute;top:16px;right:16px;background:rgba(255,255,255,.1);border:none;color:#fff;width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center}
.fn-evname{font-family:‘Bebas Neue’,sans-serif;font-size:16px;letter-spacing:.12em;color:rgba(255,255,255,.35);margin-bottom:4px}
.fn-wc{font-size:11px;color:rgba(255,255,255,.25);text-transform:uppercase;letter-spacing:.12em;margin-bottom:28px}
.fn-row{display:flex;align-items:center;gap:16px;width:100%;justify-content:center}
.fn-side{flex:1;max-width:140px}
.fn-name{font-family:‘Bebas Neue’,sans-serif;font-size:clamp(26px,6.5vw,52px);letter-spacing:.04em;line-height:1.1;color:#fff}
.fn-rec{font-size:13px;color:rgba(255,255,255,.35);margin-top:6px}
.fn-vs{font-family:‘Bebas Neue’,sans-serif;font-size:clamp(20px,5vw,36px);color:rgba(255,255,255,.12);flex-shrink:0}
.fn-nav{display:flex;gap:10px;margin-top:32px}
.fn-btn{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);color:rgba(255,255,255,.5);padding:8px 20px;border-radius:6px;cursor:pointer;font:500 12px ‘DM Sans’,sans-serif;display:flex;align-items:center;gap:5px;transition:background .15s,color .15s}
.fn-btn:hover{background:rgba(255,255,255,.12);color:#fff}
.fn-btn svg{width:13px;height:13px}
.fn-count{font-size:11px;color:rgba(255,255,255,.25);margin-top:14px;letter-spacing:.06em}

/* Name modal */
.nm-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:400;align-items:center;justify-content:center;padding:20px}
.nm-bg.open{display:flex}
.nm-box{background:#1c1c1c;border:1px solid var(–border2);border-radius:12px;padding:24px 20px;width:100%;max-width:320px}
.nm-box h3{font-family:‘Bebas Neue’,sans-serif;font-size:22px;letter-spacing:.06em;margin-bottom:6px}
.nm-box p{font-size:12px;color:var(–muted);margin-bottom:16px;line-height:1.55}
.nm-input{width:100%;background:var(–card2);border:1px solid var(–border2);color:var(–text);padding:10px 12px;border-radius:8px;font:500 14px ‘DM Sans’,sans-serif;margin-bottom:10px}
.nm-input:focus{outline:none;border-color:var(–red)}
.nm-btn{width:100%;background:var(–red);border:none;color:#fff;padding:10px;border-radius:8px;font:600 13px ‘DM Sans’,sans-serif;cursor:pointer}

/* Leaderboard */
.lb-card{background:var(–card);border:1px solid var(–border);border-radius:10px;margin-bottom:10px;overflow:hidden}
.lb-hdr{padding:11px 14px;border-bottom:1px solid var(–border);display:flex;align-items:center;justify-content:space-between}
.lb-title{font-family:‘Bebas Neue’,sans-serif;font-size:16px;letter-spacing:.06em}
.lb-row{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(–border)}
.lb-row:last-child{border-bottom:none}
.lb-rank{font-family:‘Bebas Neue’,sans-serif;font-size:18px;color:var(–muted);width:20px;flex-shrink:0}
.lb-rank.gold{color:var(–gold)}
.lb-name{flex:1;font-size:13px;font-weight:500}
.lb-score{font-family:‘Bebas Neue’,sans-serif;font-size:20px;color:var(–red)}
.lb-pct{font-size:10px;color:var(–muted)}
.lb-empty{padding:14px;font-size:12px;color:var(–muted);text-align:center}

/* Toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:#222;border:1px solid var(–border2);color:var(–text);padding:9px 16px;border-radius:8px;font-size:12px;z-index:500;transition:transform .25s;white-space:nowrap;pointer-events:none}
.toast.show{transform:translateX(-50%) translateY(0)}

/* Filter results note */
.filter-note{font-size:11px;color:var(–muted);padding:4px 0 10px;text-align:center}

@media(min-width:420px){.content{padding:16px}.fn{font-size:22px}.fn.sm{font-size:17px}.hero h1{font-size:38px}}
@media(min-width:640px){.hdr{padding:0 20px}.hero{padding:22px 20px 16px}.content{padding:20px}}
</style>

</head>
<body>

<!-- Fighter stats modal -->

<div class="modal-bg" id="statsModal" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <button class="modal-close" onclick="closeModal()">×</button>
    <div class="modal-fighter" id="mName"></div>
    <div class="modal-sub" id="mSub"></div>
    <div class="modal-grid" id="mGrid"></div>
    <div id="mBars"></div>
  </div>
</div>

<!-- Fight night mode -->

<div class="fn-mode" id="fnMode">
  <button class="fn-close" onclick="closeFN()">×</button>
  <div class="fn-evname" id="fn-ev"></div>
  <div class="fn-wc" id="fn-wc"></div>
  <div class="fn-row">
    <div class="fn-side">
      <div class="fn-name" id="fn-n1"></div>
      <div class="fn-rec" id="fn-r1"></div>
    </div>
    <div class="fn-vs">VS</div>
    <div class="fn-side">
      <div class="fn-name" id="fn-n2"></div>
      <div class="fn-rec" id="fn-r2"></div>
    </div>
  </div>
  <div class="fn-nav">
    <button class="fn-btn" onclick="fnNav(-1)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>Prev</button>
    <button class="fn-btn" onclick="fnNav(1)">Next<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg></button>
  </div>
  <div class="fn-count" id="fn-count"></div>
</div>

<!-- Name entry -->

<div class="nm-bg" id="nmBg">
  <div class="nm-box">
    <h3>Join the Predictor</h3>
    <p>Enter your name to track your picks across every fight card.</p>
    <input class="nm-input" id="nmInput" type="text" placeholder="Your name" maxlength="20" onkeydown="if(event.key==='Enter')saveName()">
    <button class="nm-btn" onclick="saveName()">Start Picking</button>
  </div>
</div>

<!-- Toast -->

<div class="toast" id="toast"></div>

<header class="hdr">
  <div class="logo">
    <div class="logo-hex">UFC</div>
    <span class="logo-text">FIGHT <span>CARDS</span></span>
  </div>
  <div class="hdr-right">
    <button class="btn-tv" onclick="openFN()" title="Fight night mode">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
    </button>
    <a class="btn-ufc" href="https://www.ufc.com/events" target="_blank">
      <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
      UFC.com
    </a>
  </div>
</header>

<section class="hero">
  <h1>UPCOMING<br><span>FIGHT CARDS</span></h1>
  <p class="hero-sub">Verified from UFC.com · Updated May 8, 2026</p>
  <div class="cd-wrap" id="cdWrap" style="display:none">
    <div class="cd-label">Next Event Countdown</div>
    <div class="cd-event" id="cdEv"></div>
    <div class="cd-timer" id="cdTimer"></div>
  </div>
</section>

<div class="stats" id="stats"></div>

<div class="tabs" id="tabs">
  <button class="tab on"  onclick="setFilter('all',this)">All</button>
  <button class="tab" onclick="setFilter('Heavyweight',this)">Heavyweight</button>
  <button class="tab" onclick="setFilter('Light Heavyweight',this)">Lt. HW</button>
  <button class="tab" onclick="setFilter('Middleweight',this)">MW</button>
  <button class="tab" onclick="setFilter('Welterweight',this)">WW</button>
  <button class="tab" onclick="setFilter('Lightweight',this)">LW</button>
  <button class="tab" onclick="setFilter('Featherweight',this)">FW</button>
  <button class="tab" onclick="setFilter('Bantamweight',this)">BW</button>
  <button class="tab" onclick="setFilter('Flyweight',this)">FLY</button>
</div>

<main class="content">
  <div id="app"></div>
  <div id="lb"></div>
</main>

// ── Toast ──
function toast(msg) {

  t.classList.add('show');
  setTimeout(function(){ t.classList.remove('show'); }, 2400);
}

// ── Odds formatter ──
function fmtOdds(n) { return n > 0 ? '+'+n : ''+n; }

// ── Countdown — FIX: properly parse 12-hour time to 24-hour ──
function parseMainCardHour(timeStr) {
  // e.g. "9:00 PM ET" → 21, "7:00 AM ET" → 7, "8:00 PM ET" → 20
  var m = (timeStr || '').match(/(\d+):(\d+)\s*(AM|PM)/i);
  if (!m) return 21; // default 9pm
  var h = parseInt(m[1], 10);
  var ampm = m[3].toUpperCase();
  if (ampm === 'PM' && h !== 12) h += 12;
  if (ampm === 'AM' && h === 12) h = 0;
  return h;
}

function updateCountdown() {
  var now = Date.now();
  var upcoming = EVENTS.filter(function(e){ return new Date(e.date + 'T00:00:00') >= now - 864e5; });
  if (!upcoming.length) return;
  var next = upcoming[0];
  var h = parseMainCardHour(next.mainCardTime);
  // Build target as UTC-4 (ET) approximation — use local date string
  var dateParts = next.date.split('-');
  var target = new Date(
    parseInt(dateParts[0]), parseInt(dateParts[1])-1, parseInt(dateParts[2]),
    h, 0, 0
  ).getTime();

  var diff = target - now;
  var wrap = document.getElementById('cdWrap');
  wrap.style.display = 'block';
  document.getElementById('cdEv').textContent = next.name;

  if (diff <= 0) {
    document.getElementById('cdTimer').innerHTML = '<span class="cd-live">LIVE NOW</span>';
    return;
  }

  var days = Math.floor(diff / 864e5);
  var hrs  = Math.floor((diff % 864e5) / 36e5);
  var mins = Math.floor((diff % 36e5) / 6e4);
  var secs = Math.floor((diff % 6e4) / 1e3);

  var html = '';
  if (days > 0) {
    html += '<div class="cd-unit"><div class="cd-num">'+days+'</div><div class="cd-lbl">Days</div></div><div class="cd-sep">:</div>';
  }
  html += '<div class="cd-unit"><div class="cd-num">'+pad(hrs)+'</div><div class="cd-lbl">Hrs</div></div>';
  html += '<div class="cd-sep">:</div>';
  html += '<div class="cd-unit"><div class="cd-num">'+pad(mins)+'</div><div class="cd-lbl">Min</div></div>';
  html += '<div class="cd-sep">:</div>';
  html += '<div class="cd-unit"><div class="cd-num">'+pad(secs)+'</div><div class="cd-lbl">Sec</div></div>';
  document.getElementById('cdTimer').innerHTML = html;
}

function pad(n) { return n < 10 ? '0'+n : ''+n; }
setInterval(updateCountdown, 1000);

// ── Fighter stats modal ──
function openStats(fi) {
  var f = JSON.parse(decodeURIComponent(fi));
  if (!f || !f.stats) { toast('Detailed stats not available'); return; }
  document.getElementById('mName').textContent = f.name;
  document.getElementById('mSub').textContent  = f.rec + (f.rank ? ' · ' + f.rank : '');
  document.getElementById('mGrid').innerHTML =
    mstat(f.stats.kos,  'KO / TKO Wins') +
    mstat(f.stats.subs, 'Submission Wins') +
    mstat(f.stats.slpm, 'Sig Strikes / Min') +
    mstat(f.stats.tdavg,'Takedowns / 15 Min');
  document.getElementById('mBars').innerHTML =
    mbar('Striking accuracy', f.stats.stracc) +
    mbar('Takedown defense',  f.stats.tddefs);
  document.getElementById('statsModal').classList.add('open');
}
function mstat(val, lbl) {
  return '<div class="mstat"><div class="mstat-val">'+val+'</div><div class="mstat-lbl">'+lbl+'</div></div>';
}
function mbar(lbl, val) {
  return '<div class="mbar-wrap"><div class="mbar-lbl"><span>'+lbl+'</span><span>'+val+'%</span></div>'
    +'<div class="mbar"><div class="mbar-fill" style="width:'+Math.min(val,100)+'%"></div></div></div>';
}
function closeModal() { document.getElementById('statsModal').classList.remove('open'); }

// ── Name entry ──
function checkName(cb) {
  if (user) { cb(); return; }
  document.getElementById('nmBg').classList.add('open');
  document.getElementById('nmInput').focus();
  window._cb = cb;
}
function saveName() {
  var v = document.getElementById('nmInput').value.trim();
  if (!v) return;
  user = v;
  localStorage.setItem('ufc_name', user);
  document.getElementById('nmBg').classList.remove('open');
  if (window._cb) { window._cb(); window._cb = null; }
}

// ── Predictor ──
function predict(ei, fi, name, btn) {
  checkName(function() {
    var key = pk(ei, fi);
    if (preds[key] === name) { delete preds[key]; }
    else { preds[key] = name; toast('Picked: ' + name.split(' ').pop()); }
    save();
    render();
  });
}

// ── Fight night mode ──
function openFN() {
  var now = Date.now();
  var upcoming = EVENTS.filter(function(e){ return new Date(e.date+'T00:00:00') >= now - 864e5; });
  if (!upcoming.length) { toast('No upcoming events'); return; }
  fnList = upcoming[0].fights.slice();
  fnIdx  = 0;
  updateFN();
  document.getElementById('fnMode').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeFN() {
  document.getElementById('fnMode').classList.remove('open');
  document.body.style.overflow = '';
}
function fnNav(d) {
  fnIdx = Math.max(0, Math.min(fnList.length-1, fnIdx+d));
  updateFN();
}
function updateFN() {
  var f = fnList[fnIdx];
  var ev = EVENTS.filter(function(e){ return new Date(e.date+'T00:00:00') >= Date.now()-864e5; })[0];
  document.getElementById('fn-ev').textContent    = ev ? ev.name : '';
  document.getElementById('fn-wc').textContent    = f.label + ' · ' + f.wc + (f.title ? ' · TITLE' : '');
  document.getElementById('fn-n1').textContent    = f.f1.name;
  document.getElementById('fn-r1').textContent    = f.f1.rec;
  document.getElementById('fn-n2').textContent    = f.f2.name;
  document.getElementById('fn-r2').textContent    = f.f2.rec;
  document.getElementById('fn-count').textContent = (fnIdx+1) + ' of ' + fnList.length;
}

// ── Render fighter ──
function ftHTML(f, right, size) {
  var r   = right ? 'r' : '';
  var sz  = size === 'sm' ? 'sm' : size === 'xs' ? 'xs' : '';
  var champ = f.rank === 'C';
  var rank  = (!champ && f.rank) ? f.rank : null;
  var pill  = champ  ? '<div class="fpills"><span class="pchamp">CHAMP</span></div>'
            : rank   ? '<div class="fpills"><span class="prank">'+rank+'</span></div>' : '';
  var hasStats = !!f.stats;
  var enc  = encodeURIComponent(JSON.stringify({name:f.name, rec:f.rec, rank:f.rank, stats:f.stats}));
  var click = hasStats ? ' onclick="openStats(\''+enc+'\')" style="cursor:pointer"' : '';
  var hint  = (hasStats && size !== 'xs') ? '<div class="stats-hint">tap for stats</div>' : '';
  return '<div class="ft '+r+'"'+click+'>'
    + '<div class="fn '+sz+'">'+f.name+'</div>'
    + (f.rec ? '<div class="frec">'+f.rec+'</div>' : '')
    + pill + hint + '</div>';
}

    + '<div class="flbl '+lblCls+'">'+lbl+'</div>'
    + '<div class="mu">'
    + ftHTML(fight.f1, false, sz)
    + '<div class="vc"><span class="vs">VS</span>'+(isMain ? '<span class="wc-lbl">'+fight.wc+'</span>' : '')+'</div>'
    + ftHTML(fight.f2, true, sz)
    + '</div>';

  // Odds (main/co-main only)
  if (fight.odds && (isMain || isCo)) {
    var o1 = fight.odds.f1, o2 = fight.odds.f2;
    var fav1 = o1 < 0;
    html += '<div class="odds-row">'
      + '<span class="odds-pill '+(fav1?'odds-fav':'odds-dog')+'">'+fmtOdds(o1)+'</span>'
      + '<span class="odds-lbl">moneyline</span>'
      + '<span class="odds-pill '+(!fav1?'odds-fav':'odds-dog')+'">'+fmtOdds(o2)+'</span>'
      + '</div>';
  }

  html += '</div>';

  // Predict row — only main card fights (label = Main Event / Co-Main / Main Card)
  var isPredFight = isMain || isCo || fight.label === 'Main Card';
  if (isPredFight) {
    var n1 = fight.f1.name.split(' ').pop();
    var n2 = fight.f2.name.split(' ').pop();
    var fn1 = fight.f1.name.replace(/'/g, "\\'");
    var fn2 = fight.f2.name.replace(/'/g, "\\'");

    function btnCls(fname) {
      var base = 'pred-btn';
      if (result) {
        if (myPick === fname && result === fname) return base + ' win';
        if (myPick === fname && result !== fname) return base + ' lose';
      }
      if (myPick === fname) return base + ' sel';
      return base;
    }

    html += '<div class="pred-row">'
      + '<span class="pred-lbl">Pick</span>'
      + '<button class="'+btnCls(fight.f1.name)+'" onclick="predict('+ei+','+fi+',\''+fn1+'\',this)">'+n1+'</button>'
      + '<button class="'+btnCls(fight.f2.name)+'" onclick="predict('+ei+','+fi+',\''+fn2+'\',this)">'+n2+'</button>'
      + '</div>';
  }

  return html;
}

// ── Render event card ──
function eventHTML(ev, evIdx, isFeat) {
  var now    = Date.now();
  var du     = Math.ceil((new Date(ev.date+'T00:00:00') - now) / 864e5);
  var duLbl  = du === 0 ? 'Tonight' : du === 1 ? 'Tomorrow' : du > 0 ? 'In '+du+' days' : 'Completed';
  var tc     = ev.fights.filter(function(f){ return f.title; }).length;
  var isPPV  = /ufc \d/i.test(ev.name);

  // ── FILTER FIX: when a filter is active, reorder fights so matching ones show at top
  // but always keep the original main event as index 0 for the card header display.
  // Instead of hiding fights, we show the whole card and highlight matching fights.
  var allFights = ev.fights;
  var main   = allFights[0];
  var coMain = allFights[1];
  var rest   = allFights.slice(2);
  var mainCard = rest.filter(function(f){ return f.label === 'Main Card'; });
  var prelims  = rest.filter(function(f){ return f.label !== 'Main Card'; });

  // Highlight label for filtered weight class
  function highlightWC(wc) {
    if (filter === 'all') return '';
    return wc === filter ? ' style="background:rgba(232,25,44,.08);margin:-12px -14px;padding:12px 14px;"' : '';
  }

  var mainFightHTML = '<div'+highlightWC(main.wc)+'>' + fightHTML(main, evIdx, 0, true, false) + '</div>';
  var coFightHTML   = '<div'+highlightWC(coMain.wc)+'>' + fightHTML(coMain, evIdx, 1, false, true) + '</div>';

  var mcHTML = mainCard.map(function(f, i) {
    var fi = i + 2;
    return '<div'+highlightWC(f.wc)+'>'+fightHTML(f, evIdx, fi, false, false)+'</div>';
  }).join('');

  var preHTML = prelims.map(function(f, i) {
    var fi = mainCard.length + 2 + i;
    return '<div'+highlightWC(f.wc)+'>'+fightHTML(f, evIdx, fi, false, false)+'</div>';
  }).join('');

  var pid = 'p'+evIdx;
  var totalExtra = mainCard.length + prelims.length;
  var titleBadge = tc > 0 ? '<span class="badge b-title">'+(tc>1?tc+' Title Fights':'Title Fight')+'</span>' : '';

  // Filter note — tell user which fights match
  var filterNote = '';
  if (filter !== 'all') {
    var matchCount = allFights.filter(function(f){ return f.wc === filter; }).length;
    filterNote = '<div class="filter-note">'+matchCount+' '+filter+' fight'+(matchCount!==1?'s':'')+' on this card</div>';
  }

  return '<div class="evcard'+(isFeat?' featured':'')+'">'
    + '<div class="ev-hdr">'
    +   '<div class="ev-name">'+ev.name+'</div>'
    +   '<div class="ev-meta">'
    +     '<span class="ev-detail">'+iCal+fmtDate(ev.date)+' · '+duLbl+'</span>'
    +     '<span class="ev-detail">'+iPin+ev.venue+', '+ev.location+'</span>'
    +     '<span class="ev-detail">'+iTv+ev.broadcast+'</span>'
    +     '<span class="ev-detail">'+iClk+'Main card '+ev.mainCardTime+'</span>'
    +   '</div>'
    +   '<div class="badges">'
    +     (isFeat?'<span class="badge b-next">Next Up</span>':'')
    +     titleBadge
    +     (isPPV?'<span class="badge b-ppv">PPV</span>':'')
    +   '</div>'
    + '</div>'
    + filterNote
    + mainFightHTML
    + coFightHTML
    + (totalExtra
        ? '<button class="pbtn" data-pid="'+pid+'" onclick="tp(this.dataset.pid,this)">'+iChev+totalExtra+' more fight'+(totalExtra!==1?'s':'')+'</button>'
          + '<div class="pbody" id="'+pid+'">' + mcHTML + preHTML + '</div>'
        : '')
    + '</div>';
}

// ── Leaderboard ──
function lbHTML() {
  if (!user) return '';
  var correct = 0, total = 0;
  Object.keys(preds).forEach(function(k){ if (res[k]) { total++; if (preds[k]===res[k]) correct++; } });
  var pct = total > 0 ? Math.round(correct/total*100) : 0;
  var html = '<div class="sec-lbl" style="margin-top:6px">Your Predictor Record</div>';
  html += '<div class="lb-card">';
  html += '<div class="lb-hdr"><span class="lb-title">'+user+'</span><span style="font-size:11px;color:var(--muted)">'+Object.keys(preds).length+' picks made</span></div>';
  if (total > 0) {
    html += '<div class="lb-row"><div class="lb-rank gold">W</div><div class="lb-name">Correct picks</div><div><div class="lb-score">'+correct+'/'+total+'</div><div class="lb-pct">'+pct+'% accuracy</div></div></div>';
  } else {
    html += '<div class="lb-empty">Make picks on the main card fights to track your accuracy.</div>';
  }
  html += '</div>';
  return html;
}

// ── Helpers ──
function fmtDate(d) {
  return new Date(d+'T12:00:00').toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',year:'numeric'});
}

// ── Main render ──
function render() {
  var now = Date.now();
  var events = EVENTS.filter(function(e){
    var d = new Date(e.date+'T00:00:00');
    return d >= now - 864e5 && d <= now + 864e5 * 65;
  });

  // Stats
  var titles = events.reduce(function(n,e){ return n+e.fights.filter(function(f){return f.title;}).length; },0);
  var bouts  = events.reduce(function(n,e){ return n+e.fights.length; },0);
  var du     = events.length ? Math.ceil((new Date(events[0].date+'T00:00:00')-now)/864e5) : 0;
  var duT    = du===0?'Now':du===1?'1d':du+'d';
  var picks  = Object.keys(preds).length;

  document.getElementById('stats').innerHTML =
    '<div class="stat"><div class="sv">'+events.length+'</div><div class="sl">Events</div></div>'
    +'<div class="stat"><div class="sv">'+titles+'</div><div class="sl">Titles</div></div>'
    +'<div class="stat"><div class="sv">'+bouts+'</div><div class="sl">Bouts</div></div>'
    +'<div class="stat"><div class="sv">'+picks+'</div><div class="sl">My Picks</div></div>';

  // Filter — when active, show all events but skip events with zero matching fights
  var shown = events;
  if (filter !== 'all') {
    shown = events.filter(function(e){
      return e.fights.some(function(f){ return f.wc === filter; });
    });
  }

  if (!shown.length) {
    document.getElementById('app').innerHTML = '<p style="color:var(--muted);text-align:center;padding:32px 0">No '+filter+' fights in the next 65 days.</p>';
  } else {
    document.getElementById('app').innerHTML =
      '<div class="sec-lbl">Upcoming Events</div>'
      + shown.map(function(e, i){
          return eventHTML(e, EVENTS.indexOf(e), i===0);
        }).join('');
  }

  document.getElementById('lb').innerHTML = lbHTML();
  updateCountdown();
}

render();
</script>
