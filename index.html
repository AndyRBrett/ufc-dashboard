<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UFC Fight Cards</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--red:#e8192c;--gold:#c9a84c;--bg:#0a0a0a;--card:#141414;--card2:#1c1c1c;--border:rgba(255,255,255,.09);--border2:rgba(255,255,255,.16);--text:#f0f0f0;--muted:#666;--muted2:#999;--green:#2ecc71}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;padding-bottom:60px;font-size:15px}
.hdr{display:flex;align-items:center;justify-content:space-between;padding:0 16px;height:52px;border-bottom:1px solid var(--border);background:rgba(10,10,10,.97);backdrop-filter:blur(8px);position:sticky;top:0;z-index:99}
.logo{display:flex;align-items:center;gap:8px}
.logo-hex{width:28px;height:28px;background:var(--red);clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:10px;color:#fff;flex-shrink:0}
.logo-text{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:.08em}
.logo-text span{color:var(--red)}
.hdr-right{display:flex;align-items:center;gap:8px}
.btn-icon{background:var(--card2);border:1px solid var(--border2);color:var(--muted2);width:34px;height:34px;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:color .15s,border-color .15s;flex-shrink:0}
.btn-icon:hover{color:var(--text);border-color:rgba(255,255,255,.3)}
.btn-icon svg{width:15px;height:15px}
.btn-ufc{background:var(--red);border:none;color:#fff;padding:6px 10px;border-radius:6px;font:600 11px 'DM Sans',sans-serif;cursor:pointer;text-decoration:none;display:flex;align-items:center;gap:3px}
.btn-ufc:hover{background:#c9101f}
.hero{padding:18px 16px 14px;border-bottom:1px solid var(--border)}
.hero h1{font-family:'Bebas Neue',sans-serif;font-size:32px;letter-spacing:.07em;line-height:1}
.hero h1 span{color:var(--red)}
.hero-sub{font-size:11px;color:var(--muted);margin-top:4px}
.countdown-wrap{margin-top:12px;background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:10px 14px}
.cd-label{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-bottom:4px}
.cd-event{font-size:11px;font-weight:600;color:var(--text);margin-bottom:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cd-timer{display:flex;align-items:center;gap:6px}
.cd-unit{text-align:center;min-width:38px}
.cd-num{font-family:'Bebas Neue',sans-serif;font-size:26px;line-height:1;color:var(--red)}
.cd-lbl{font-size:8px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-top:1px}
.cd-sep{font-family:'Bebas Neue',sans-serif;font-size:20px;color:rgba(255,255,255,.12);padding-bottom:10px}
.cd-live{display:inline-block;background:rgba(232,25,44,.15);color:var(--red);border:1px solid rgba(232,25,44,.3);font-size:11px;font-weight:600;padding:4px 12px;border-radius:4px;letter-spacing:.04em}
.stats{display:grid;grid-template-columns:repeat(4,1fr);background:var(--card);border-bottom:1px solid var(--border)}
.stat{padding:10px 6px;text-align:center;border-right:1px solid var(--border)}
.stat:last-child{border-right:none}
.sv{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:.05em;line-height:1}
.sl{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-top:2px}
.filter-wrap{padding:10px 12px;border-bottom:1px solid var(--border);display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.filter-wrap::-webkit-scrollbar{display:none}
.ftab{padding:5px 12px;border-radius:20px;font-size:11px;font-weight:600;color:var(--muted);border:1px solid var(--border);background:none;cursor:pointer;white-space:nowrap;transition:all .15s;letter-spacing:.03em}
.ftab.active{background:var(--red);color:#fff;border-color:var(--red)}
.ftab:hover:not(.active){color:var(--text);border-color:var(--border2)}
.ev-divider{display:flex;align-items:center;gap:10px;padding:16px 16px 0;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
.ev-divider::after{content:'';flex:1;height:1px;background:var(--border)}
.ev-band{background:linear-gradient(135deg,#1a0808 0%,#160d0d 100%);border-top:3px solid var(--red);padding:14px 16px 12px}
.ev-band.dim-event{border-top-color:#2a2a2a;background:#111}
.ev-number{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.12em;margin-bottom:4px}
.ev-name{font-family:'Bebas Neue',sans-serif;font-size:19px;letter-spacing:.06em;line-height:1;margin-bottom:8px;color:#fff}
.ev-row{display:flex;flex-wrap:wrap;gap:4px 14px;margin-bottom:6px}
.ev-detail{font-size:11px;color:var(--muted2);display:flex;align-items:center;gap:3px}
.ev-detail svg{width:10px;height:10px;opacity:.5;flex-shrink:0}
.ev-badges{display:flex;gap:5px;flex-wrap:wrap}
.badge{font-size:9px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;padding:2px 7px;border-radius:3px}
.b-next{background:rgba(232,25,44,.15);color:var(--red);border:1px solid rgba(232,25,44,.3)}
.b-title{background:rgba(201,168,76,.12);color:var(--gold);border:1px solid rgba(201,168,76,.25)}
.b-ppv{background:rgba(255,255,255,.06);color:var(--muted2);border:1px solid var(--border)}
.fights-wrap{background:var(--card)}
.fight-row{padding:12px 16px;border-bottom:1px solid var(--border)}
.fight-row:last-of-type{border-bottom:none}
.fight-row.main-event{background:rgba(232,25,44,.03);border-left:3px solid var(--red);padding-left:13px}
.fight-row.co-main{background:rgba(201,168,76,.02);border-left:3px solid var(--gold);padding-left:13px}
.fight-row.main-card{border-left:3px solid rgba(255,255,255,.06);padding-left:13px}
.fight-row.prelim{border-left:3px solid transparent;background:rgba(255,255,255,.01)}
.flbl{font-size:9px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px}
.flbl.main{color:var(--red)}.flbl.co{color:var(--gold)}.flbl.pre{color:var(--muted)}
.mu{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.ft{display:flex;flex-direction:column;gap:1px;min-width:0}
.ft.r{align-items:flex-end;text-align:right}
.fn{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:.03em;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:opacity .15s}
.fn.sm{font-size:16px}.fn.xs{font-size:13px;font-family:'DM Sans',sans-serif;font-weight:500;letter-spacing:0}
.frec{font-size:11px;color:var(--muted2);margin-top:1px}
.fpills{display:flex;gap:3px;flex-wrap:wrap;margin-top:2px}
.ft.r .fpills{justify-content:flex-end}
.pchamp{font-size:9px;font-weight:600;padding:1px 5px;border-radius:2px;background:rgba(201,168,76,.1);color:var(--gold);border:1px solid rgba(201,168,76,.18);letter-spacing:.06em}
.prank{font-size:9px;font-weight:600;padding:1px 5px;border-radius:2px;background:rgba(255,255,255,.06);color:var(--muted2);letter-spacing:.05em}
.vc{display:flex;flex-direction:column;align-items:center;gap:2px;flex-shrink:0}
.vs{font-family:'Bebas Neue',sans-serif;font-size:12px;color:rgba(255,255,255,.14);letter-spacing:.08em}
.wc-sm{font-size:8px;color:var(--muted);text-align:center;text-transform:uppercase;letter-spacing:.04em;line-height:1.3;max-width:50px}
.stats-hint{font-size:9px;color:var(--muted);margin-top:2px;letter-spacing:.02em}
.ft.r .stats-hint{text-align:right}
.clickable{cursor:pointer}
.clickable:hover .fn{opacity:.75}
.odds-row{display:flex;justify-content:space-between;margin-top:8px;padding-top:8px;border-top:1px solid var(--border)}
.odds-side{display:flex;flex-direction:column;gap:1px}
.odds-side.r{align-items:flex-end}
.odds-name{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.odds-val{font-size:13px;font-weight:600}
.odds-val.fav{color:var(--green)}.odds-val.dog{color:#e05060}
.odds-center{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;align-self:center}
.pick-row{display:flex;align-items:center;gap:6px;margin-top:8px;padding-top:8px;border-top:1px solid var(--border)}
.pick-lbl{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;white-space:nowrap;flex-shrink:0}
.pick-btn{flex:1;padding:5px 6px;border-radius:5px;border:1px solid var(--border2);background:none;color:var(--muted2);font:500 11px 'DM Sans',sans-serif;cursor:pointer;transition:all .15s;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pick-btn:hover{border-color:rgba(255,255,255,.3);color:var(--text)}
.pick-btn.sel{background:rgba(232,25,44,.12);border-color:var(--red);color:var(--red)}
.pick-btn.correct{background:rgba(46,204,113,.1);border-color:var(--green);color:var(--green)}
.pick-btn.wrong{opacity:.4;text-decoration:line-through}
.more-btn{width:100%;background:var(--card2);border:none;border-top:1px solid var(--border);padding:9px 16px;display:flex;align-items:center;gap:6px;font-size:10px;color:var(--muted);cursor:pointer;font-family:'DM Sans',sans-serif;letter-spacing:.06em;text-transform:uppercase;transition:color .15s;text-align:left}
.more-btn:hover{color:var(--muted2)}
.more-btn svg{width:12px;height:12px;transition:transform .2s;margin-left:auto;flex-shrink:0}
.more-btn.open svg{transform:rotate(180deg)}
.more-body{display:none}.more-body.open{display:block}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:200;align-items:flex-end;justify-content:center}
.modal-bg.open{display:flex}
.modal{background:#1c1c1c;border:1px solid var(--border2);border-radius:14px 14px 0 0;padding:20px 18px 36px;width:100%;max-width:480px;animation:slideUp .22s ease}
@keyframes slideUp{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.modal-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:4px}
.modal-close{background:rgba(255,255,255,.08);border:none;color:var(--muted2);cursor:pointer;font-size:16px;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.modal-close:hover{background:rgba(255,255,255,.15);color:var(--text)}
.modal-name{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:.05em;line-height:1}
.modal-sub{font-size:12px;color:var(--muted);margin-bottom:14px}
.modal-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.ms{background:var(--card2);border-radius:8px;padding:10px 12px;border:1px solid var(--border)}
.ms-val{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:.04em}
.ms-lbl{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-top:2px}
.mbar-wrap{margin-top:8px}
.mbar-lbl{font-size:10px;color:var(--muted);margin-bottom:4px;display:flex;justify-content:space-between}
.mbar{height:4px;background:var(--border);border-radius:2px;overflow:hidden}
.mbar-fill{height:100%;background:var(--red);border-radius:2px;transition:width .5s ease}
.fn-mode{display:none;position:fixed;inset:0;background:#000;z-index:300;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
.fn-mode.open{display:flex}
.fn-close{position:absolute;top:16px;right:16px;background:rgba(255,255,255,.08);border:none;color:#fff;width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center}
.fn-ev{font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:.12em;color:rgba(255,255,255,.35);margin-bottom:4px}
.fn-wc{font-size:11px;color:rgba(255,255,255,.28);text-transform:uppercase;letter-spacing:.1em;margin-bottom:28px}
.fn-mu{display:flex;align-items:center;justify-content:center;gap:16px;width:100%;flex-wrap:wrap}
.fn-ft{flex:1;min-width:100px}
.fn-ft.r{text-align:right}
.fn-nm{font-family:'Bebas Neue',sans-serif;font-size:clamp(26px,7vw,52px);letter-spacing:.04em;line-height:1.1;color:#fff}
.fn-rc{font-size:13px;color:rgba(255,255,255,.38);margin-top:4px}
.fn-vs{font-family:'Bebas Neue',sans-serif;font-size:20px;color:rgba(255,255,255,.12);letter-spacing:.1em;flex-shrink:0}
.fn-nav{display:flex;gap:10px;margin-top:28px}
.fn-nb{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);color:rgba(255,255,255,.55);padding:8px 18px;border-radius:6px;cursor:pointer;font:500 12px 'DM Sans',sans-serif;display:flex;align-items:center;gap:5px;transition:all .15s}
.fn-nb:hover{background:rgba(255,255,255,.13);color:#fff}
.fn-nb svg{width:13px;height:13px}
.fn-ctr{font-size:10px;color:rgba(255,255,255,.25);margin-top:12px;letter-spacing:.06em}
.nm-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:400;align-items:center;justify-content:center;padding:20px}
.nm-bg.open{display:flex}
.nm-box{background:#1c1c1c;border:1px solid var(--border2);border-radius:12px;padding:24px 20px;width:100%;max-width:320px}
.nm-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:6px}
.nm-close{background:rgba(255,255,255,.08);border:none;color:var(--muted2);cursor:pointer;font-size:16px;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.nm-close:hover{background:rgba(255,255,255,.15);color:var(--text)}
.nm-box h3{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:.06em}
.nm-box p{font-size:12px;color:var(--muted);margin-bottom:14px;line-height:1.55}
.nm-input{width:100%;background:var(--card2);border:1px solid var(--border2);color:var(--text);padding:10px 12px;border-radius:7px;font:500 14px 'DM Sans',sans-serif;margin-bottom:10px}
.nm-input:focus{outline:none;border-color:var(--red)}
.nm-btn{width:100%;background:var(--red);border:none;color:#fff;padding:10px;border-radius:7px;font:600 13px 'DM Sans',sans-serif;cursor:pointer}
.nm-btn:hover{background:#c9101f}
.lb-wrap{margin:12px 16px;background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.lb-hdr{padding:10px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.lb-title{font-family:'Bebas Neue',sans-serif;font-size:15px;letter-spacing:.06em}
.lb-row{display:flex;align-items:center;gap:10px;padding:9px 14px}
.lb-rank{font-family:'Bebas Neue',sans-serif;font-size:18px;color:var(--gold);width:20px;text-align:center;flex-shrink:0}
.lb-name{flex:1;font-size:13px;font-weight:500}
.lb-score{font-family:'Bebas Neue',sans-serif;font-size:18px;color:var(--red)}
.lb-detail{font-size:10px;color:var(--muted)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:#222;border:1px solid var(--border2);color:var(--text);padding:10px 18px;border-radius:8px;font-size:12px;z-index:500;transition:transform .25s ease;white-space:nowrap;pointer-events:none}
.toast.show{transform:translateX(-50%) translateY(0)}
@media(min-width:420px){.fn{font-size:22px}.fn.sm{font-size:17px}.hero h1{font-size:36px}}
@media(min-width:640px){.hdr{padding:0 20px}.hero{padding:22px 20px 16px}.filter-wrap{padding:10px 20px}}
</style>
</head>
<body>
<div class="modal-bg" id="statsModal" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-top"><div class="modal-name" id="mName"></div><button class="modal-close" onclick="closeModal()">x</button></div>
    <div class="modal-sub" id="mSub"></div>
    <div class="modal-grid" id="mGrid"></div>
    <div id="mBars"></div>
  </div>
</div>
<div class="fn-mode" id="fnMode">
  <button class="fn-close" onclick="closeFN()">x</button>
  <div class="fn-ev" id="fn-ev"></div>
  <div class="fn-wc" id="fn-wc"></div>
  <div class="fn-mu">
    <div class="fn-ft"><div class="fn-nm" id="fn-f1"></div><div class="fn-rc" id="fn-r1"></div></div>
    <div class="fn-vs">VS</div>
    <div class="fn-ft r"><div class="fn-nm" id="fn-f2"></div><div class="fn-rc" id="fn-r2"></div></div>
  </div>
  <div class="fn-nav">
    <button class="fn-nb" onclick="fnNav(-1)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>Prev</button>
    <button class="fn-nb" onclick="fnNav(1)">Next<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg></button>
  </div>
  <div class="fn-ctr" id="fn-ctr"></div>
</div>
<div class="nm-bg" id="nmBg">
  <div class="nm-box">
    <div class="nm-top"><h3>Join the Predictor</h3><button class="nm-close" onclick="closeNameModal()">x</button></div>
    <p>Enter your name to track your pick accuracy.</p>
    <input class="nm-input" id="nmInput" type="text" placeholder="Your name" maxlength="20" onkeydown="if(event.key==='Enter')saveName()">
    <button class="nm-btn" onclick="saveName()">Let's Go</button>
  </div>
</div>
<div class="toast" id="toast"></div>
<header class="hdr">
  <div class="logo"><div class="logo-hex">UFC</div><span class="logo-text">FIGHT <span>CARDS</span></span></div>
  <div class="hdr-right">
    <button class="btn-icon" onclick="openFN()" title="Fight night mode">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
    </button>
    <a class="btn-ufc" href="https://www.ufc.com/events" target="_blank">
      <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
      UFC.com
    </a>
  </div>
</header>
<section class="hero">
  <h1>UPCOMING<br><span>FIGHT CARDS</span></h1>
  <p class="hero-sub">Verified from UFC.com - Updated May 8, 2026</p>
  <div class="countdown-wrap" id="cd-wrap" style="display:none">
    <div class="cd-label">Next Main Card</div>
    <div class="cd-event" id="cd-event"></div>
    <div class="cd-timer" id="cd-timer"></div>
  </div>
</section>
<div class="stats" id="stats">
  <div class="stat"><div class="sv">4</div><div class="sl">Events</div></div>
  <div class="stat"><div class="sv">4</div><div class="sl">Titles</div></div>
  <div class="stat"><div class="sv">43</div><div class="sl">Bouts</div></div>
  <div class="stat"><div class="sv" id="picks-count">0</div><div class="sl">My Picks</div></div>
</div>
<div class="filter-wrap">
  <button class="ftab active" onclick="setFilter('all',this)">All</button>
  <button class="ftab" onclick="setFilter('Heavyweight',this)">Heavyweight</button>
  <button class="ftab" onclick="setFilter('Light Heavyweight',this)">Lt. Heavyweight</button>
  <button class="ftab" onclick="setFilter('Middleweight',this)">Middleweight</button>
  <button class="ftab" onclick="setFilter('Welterweight',this)">Welterweight</button>
  <button class="ftab" onclick="setFilter('Lightweight',this)">Lightweight</button>
  <button class="ftab" onclick="setFilter('Featherweight',this)">Featherweight</button>
  <button class="ftab" onclick="setFilter('Bantamweight',this)">Bantamweight</button>
  <button class="ftab" onclick="setFilter('Flyweight',this)">Flyweight</button>
</div>
<div id="app"></div>
<script>
var EVENTS = [
  {name:"UFC 328: Chimaev vs. Strickland",date:"2026-05-09",venue:"Prudential Center",loc:"Newark, NJ",tv:"Paramount+",time:"21:00",

// COUNTDOWN FIX: parse HH:MM directly, no string manipulation
function updateCountdown(){
var now = Date.now();
var upcoming = EVENTS.filter(function(e){ return new Date(e.date) >= now - 864e5; });
if(!upcoming.length) return;
var ev = upcoming[0];
var parts = ev.time.split(’:’);
var h = parseInt(parts[0],10);
var m = parseInt(parts[1]||0,10);
var dp = ev.date.split(’-’);
// Build local date at event time (ET = UTC-4 for summer)
var target = Date.UTC(parseInt(dp[0],10), parseInt(dp[1],10)-1, parseInt(dp[2],10), h+4, m, 0);
var diff = target - now;
var wrap = document.getElementById(‘cd-wrap’);
wrap.style.display = ‘block’;
document.getElementById(‘cd-event’).textContent = ev.name;
if(diff <= 0){
document.getElementById(‘cd-timer’).innerHTML = ‘<span class="cd-live">MAIN CARD LIVE NOW</span>’;
return;
}
var days  = Math.floor(diff / 864e5);
var hours = Math.floor((diff % 864e5) / 36e5);
var mins  = Math.floor((diff % 36e5) / 6e4);
var secs  = Math.floor((diff % 6e4) / 1e3);
var html = ‘’;
if(days > 0){ html += ‘<div class="cd-unit"><div class="cd-num">’+days+’</div><div class="cd-lbl">Days</div></div><div class="cd-sep">:</div>’; }
html += ‘<div class="cd-unit"><div class="cd-num">’+pad(hours)+’</div><div class="cd-lbl">Hrs</div></div>’;
html += ‘<div class="cd-sep">:</div>’;
html += ‘<div class="cd-unit"><div class="cd-num">’+pad(mins)+’</div><div class="cd-lbl">Min</div></div>’;
html += ‘<div class="cd-sep">:</div>’;
html += ‘<div class="cd-unit"><div class="cd-num">’+pad(secs)+’</div><div class="cd-lbl">Sec</div></div>’;
document.getElementById(‘cd-timer’).innerHTML = html;
}
setInterval(updateCountdown, 1000);

btn.classList.add(‘active’);
render();
}

var c2=‘pick-btn’+(myPick===fight.f2.n?’ sel’:’’)+(result===fight.f2.n?’ correct’:’’)+(result&&result!==fight.f2.n&&myPick===fight.f2.n?’ wrong’:’’);
pickHTML=’<div class="pick-row"><span class="pick-lbl">Pick:</span>’
+’<button class="'+c1+'" onclick="pickFighter('+ei+','+fi+',\''+fn1+'\')">’+n1+’</button>’
+’<button class="'+c2+'" onclick="pickFighter('+ei+','+fi+',\''+fn2+'\')">’+n2+’</button>’
+’</div>’;
}

return ‘<div class="fight-row '+rowCls+'"><div class="flbl '+lblCls+'">’+lbl+’</div>’
+’<div class="mu">’+rFighter(fight.f1,false,sz)
+’<div class="vc"><span class="vs">VS</span>’+(isMain?’<span class="wc-sm">’+fight.wc+’</span>’:’’)+’</div>’
+rFighter(fight.f2,true,sz)+’</div>’
+oddsHTML+pickHTML+’</div>’;
}

// RENDER EVENT BLOCK
function rEvent(ev, ei, evNum, visTotal){
var du=daysOut(ev.date);
var duLabel=du===0?‘Tonight’:du===1?‘Tomorrow’:du>0?‘In ‘+du+’ days’:‘Completed’;
var isFeat=ei===0;
var titleCount=ev.fights.filter(function(f){ return f.title; }).length;
var isPPV=/ufc \d/i.test(ev.name);

var mainFight=ev.fights[0]; var coFight=ev.fights[1];
var mainCardFights=ev.fights.slice(2).filter(function(f){ return f.lbl===‘Main Card’; });
var prelimFights=ev.fights.filter(function(f){ return f.lbl===‘Prelim’||f.lbl===‘Early Prelim’; });
var totalExtra=mainCardFights.length+prelimFights.length;
var pid=‘p’+ei;

var calSVG=’<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>’;
var pinSVG=’<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>’;
var tvSVG=’<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="15" rx="2"/><polyline points="17 2 12 7 7 2"/></svg>’;
var clkSVG=’<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>’;
var chevSVG=’<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>’;

var mainCardHTML=mainCardFights.map(function(f,i){
var fi=i+2; var dim=!matchesFilter(f)?’ style=“opacity:.3”’:’’;
var showPick=matchesFilter(f);
return ‘<div’+dim+’>’+rFight(f,ei,fi,showPick)+’</div>’;
}).join(’’);

var prelimHTML=prelimFights.map(function(f,i){
var fi=mainCardFights.length+2+i; var dim=!matchesFilter(f)?’ style=“opacity:.3”’:’’;
return ‘<div’+dim+’>’+rFight(f,ei,fi,false)+’</div>’;
}).join(’’);

var divider = evNum > 0
? ‘<div class="ev-divider">Event ‘+(evNum+1)+’ of ‘+visTotal+’</div>’
: ‘’;

var mainDim=!matchesFilter(mainFight)?’ style=“opacity:.3”’:’’;
var coDim=!matchesFilter(coFight)?’ style=“opacity:.3”’:’’;
var showMainPick=matchesFilter(mainFight); var showCoPick=matchesFilter(coFight);

return divider
+’<div class="ev-band '+(isFeat?'':'dim-event')+'">’
+’<div class="ev-number">Event ‘+(evNum+1)+’ of ‘+visTotal+’ - ‘+fmtDate(ev.date)+’ - ‘+duLabel+’</div>’
+’<div class="ev-name">’+ev.name+’</div>’
+’<div class="ev-row">’
+’<span class="ev-detail">’+pinSVG+ev.venue+’, ‘+ev.loc+’</span>’
+’<span class="ev-detail">’+tvSVG+ev.tv+’</span>’
+’<span class="ev-detail">’+clkSVG+‘Main card ‘+ev.time+’ ET</span>’
+’</div>’
+’<div class="ev-badges">’
+(isFeat?’<span class="badge b-next">Next Up</span>’:’’)
+(titleCount>0?’<span class="badge b-title">’+(titleCount>1?titleCount+’ Title Fights’:‘Title Fight’)+’</span>’:’’)
+(isPPV?’<span class="badge b-ppv">PPV</span>’:’’)
+’</div></div>’
+’<div class="fights-wrap">’
+’<div’+mainDim+’>’+rFight(mainFight,ei,0,showMainPick)+’</div>’
+’<div’+coDim+’>’+rFight(coFight,ei,1,showCoPick)+’</div>’
+(totalExtra
?’<button class="more-btn" data-pid="'+pid+'" onclick="tp(this.dataset.pid,this)">’+chevSVG+totalExtra+’ more fight’+(totalExtra!==1?‘s’:’’)+’</button>’
+’<div class="more-body" id="'+pid+'">’+mainCardHTML+prelimHTML+’</div>’
:’’)
+’</div>’;
}

function tp(id,btn){ document.getElementById(id).classList.toggle(‘open’); btn.classList.toggle(‘open’); }

function render(){
var now=Date.now();
var events=EVENTS.filter(function(e){ return new Date(e.date)>=now-864e5 && new Date(e.date)<=now+864e5*65; });
var totalPicks=Object.keys(preds).length;
document.getElementById(‘picks-count’).textContent=totalPicks;

var visEvents=events.filter(function(e){ return e.fights.some(matchesFilter); });
var html=’’;
if(!visEvents.length){
html=’<div style="padding:32px 16px;text-align:center;color:var(--muted);font-size:13px">No fights in this weight class across upcoming events.</div>’;
} else {
visEvents.forEach(function(ev,i){
var ei=EVENTS.indexOf(ev);
html+=rEvent(ev,ei,i,visEvents.length);
});
}

// Leaderboard
if(userName && Object.keys(preds).length>0){
var correct=0; var total=0;
Object.keys(preds).forEach(function(k){ if(results[k]){ total++; if(preds[k]===results[k])correct++; } });
var pct=total>0?Math.round(correct/total*100)+’% correct’:‘results pending’;
html+=’<div class="lb-wrap"><div class="lb-hdr"><span class="lb-title">My Predictor Record</span><span style="font-size:10px;color:var(--muted)">’+Object.keys(preds).length+’ picks</span></div>’
+’<div class="lb-row"><div class="lb-rank">1</div><div class="lb-name">’+userName+’ <span style="font-size:10px;color:var(--muted)">(you)</span></div>’
+’<div><div class="lb-score">’+(total>0?correct+’/’+total:’–’)+’</div><div class="lb-detail">’+pct+’</div></div></div></div>’;
}

document.getElementById(‘app’).innerHTML=html;
updateCountdown();
}

render();
</script>

</body>
</html>
