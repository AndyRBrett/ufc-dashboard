<?xml version="1.0" encoding="UTF-8"?>
<!--
  UFC NOCHE — decorative asset sprite
  ============================================================================
  Original artwork. Hand-authored paths, woodcut / engraving linework in the
  José Guadalupe Posada tradition (public domain). Contains no third-party
  logos, wordmarks, mascots or label artwork.

  USAGE — inline this whole file once near the top of <body>, then reference:
      <svg class="noche-motif" viewBox="0 0 200 240" aria-hidden="true">
        <use href="#noche-calavera"/>
      </svg>
  Most symbols paint with `currentColor`, so set `color:` on the host element.
  The papel picado tile is the exception: it carries its own tricolor palette.
-->
<svg xmlns="http://www.w3.org/2000/svg" class="noche-sprite" aria-hidden="true"
     focusable="false" style="position:absolute;width:0;height:0;overflow:hidden">
  <defs>

    <!-- one agave blade, tip up, origin at the base -->
    <g id="noche-agave-blade">
      <path d="M0,0 C-8,-28 -7,-62 0,-102 C7,-62 8,-28 0,0 Z"
            fill="currentColor" fill-opacity=".22"
            stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M0,-8 V-93" stroke="currentColor" stroke-width="1.1" opacity=".85"/>
      <path d="M-3.6,-30 L0,-38 M3.6,-30 L0,-38 M-3.2,-52 L0,-59 M3.2,-52 L0,-59"
            stroke="currentColor" stroke-width=".8" opacity=".6" fill="none"/>
    </g>

    <!-- marigold / cempasúchil rosette, centred at 24,24 -->
    <g id="noche-marigold-core">
      <g fill="currentColor">
        <ellipse cx="0" cy="-15" rx="3.6" ry="8"/>
        <ellipse cx="0" cy="-15" rx="3.6" ry="8" transform="rotate(45)"/>
        <ellipse cx="0" cy="-15" rx="3.6" ry="8" transform="rotate(90)"/>
        <ellipse cx="0" cy="-15" rx="3.6" ry="8" transform="rotate(135)"/>
        <ellipse cx="0" cy="-15" rx="3.6" ry="8" transform="rotate(180)"/>
        <ellipse cx="0" cy="-15" rx="3.6" ry="8" transform="rotate(225)"/>
        <ellipse cx="0" cy="-15" rx="3.6" ry="8" transform="rotate(270)"/>
        <ellipse cx="0" cy="-15" rx="3.6" ry="8" transform="rotate(315)"/>
      </g>
      <g fill="currentColor" opacity=".78">
        <ellipse cx="0" cy="-9" rx="2.8" ry="6" transform="rotate(22.5)"/>
        <ellipse cx="0" cy="-9" rx="2.8" ry="6" transform="rotate(67.5)"/>
        <ellipse cx="0" cy="-9" rx="2.8" ry="6" transform="rotate(112.5)"/>
        <ellipse cx="0" cy="-9" rx="2.8" ry="6" transform="rotate(157.5)"/>
        <ellipse cx="0" cy="-9" rx="2.8" ry="6" transform="rotate(202.5)"/>
        <ellipse cx="0" cy="-9" rx="2.8" ry="6" transform="rotate(247.5)"/>
        <ellipse cx="0" cy="-9" rx="2.8" ry="6" transform="rotate(292.5)"/>
        <ellipse cx="0" cy="-9" rx="2.8" ry="6" transform="rotate(337.5)"/>
      </g>
      <circle r="4.2" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <circle r="1.4" fill="currentColor"/>
    </g>

  </defs>

  <!-- ==========================================================================
       PAPEL PICADO — seamless horizontal tile, 3 panels (verde / hueso / rojo)
       Tile repeats on x. Cut-outs are true holes (fill-rule: evenodd).
       ======================================================================= -->
  <defs>
   <g id="noche-papel-art">
    <!-- panel 1 · verde -->
    <g fill="#1e8a53">
      <path fill-rule="evenodd" d="M2,12 H128 V74
        Q107,95 86,74 Q65,95 44,74 Q23,95 2,74 Z
        M65,26 L81,44 L65,62 L49,44 Z
        M18,34 a8,8 0 1,1 16,0 a8,8 0 1,1 -16,0 Z
        M96,34 a8,8 0 1,1 16,0 a8,8 0 1,1 -16,0 Z
        M20,52 h14 v7 h-14 Z
        M96,52 h14 v7 h-14 Z
        M19,78 a4,4 0 1,1 8,0 a4,4 0 1,1 -8,0 Z
        M103,78 a4,4 0 1,1 8,0 a4,4 0 1,1 -8,0 Z
        M65,71 L70,78 L65,85 L60,78 Z"/>
    </g>
    <rect x="2" y="12" width="126" height="5" fill="#0d3f27" opacity=".55"/>

    <!-- panel 2 · hueso -->
    <g fill="#e9dcc2">
      <path fill-rule="evenodd" d="M132,12 H258 V74
        Q237,95 216,74 Q195,95 174,74 Q153,95 132,74 Z
        M195,26 L211,44 L195,62 L179,44 Z
        M148,34 a8,8 0 1,1 16,0 a8,8 0 1,1 -16,0 Z
        M226,34 a8,8 0 1,1 16,0 a8,8 0 1,1 -16,0 Z
        M150,52 h14 v7 h-14 Z
        M226,52 h14 v7 h-14 Z
        M149,78 a4,4 0 1,1 8,0 a4,4 0 1,1 -8,0 Z
        M233,78 a4,4 0 1,1 8,0 a4,4 0 1,1 -8,0 Z
        M195,71 L200,78 L195,85 L190,78 Z"/>
    </g>
    <rect x="132" y="12" width="126" height="5" fill="#9a8a70" opacity=".55"/>

    <!-- panel 3 · rojo -->
    <g fill="#c02a20">
      <path fill-rule="evenodd" d="M262,12 H388 V74
        Q367,95 346,74 Q325,95 304,74 Q283,95 262,74 Z
        M325,26 L341,44 L325,62 L309,44 Z
        M278,34 a8,8 0 1,1 16,0 a8,8 0 1,1 -16,0 Z
        M356,34 a8,8 0 1,1 16,0 a8,8 0 1,1 -16,0 Z
        M280,52 h14 v7 h-14 Z
        M356,52 h14 v7 h-14 Z
        M279,78 a4,4 0 1,1 8,0 a4,4 0 1,1 -8,0 Z
        M363,78 a4,4 0 1,1 8,0 a4,4 0 1,1 -8,0 Z
        M325,71 L330,78 L325,85 L320,78 Z"/>
    </g>
    <rect x="262" y="12" width="126" height="5" fill="#5e120d" opacity=".55"/>

    <!-- the string, drawn last so it sits on top of the hems -->
    <path d="M0,9 Q97.5,20 195,9 T390,9" fill="none"
          stroke="#9c6716" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M0,9 Q97.5,20 195,9 T390,9" fill="none"
          stroke="#eec462" stroke-width=".7" opacity=".6"/>
   </g>

   <!-- Paint server: tiles the banner on x at exact integer steps (195 x 54),
        so there are no seams and nothing gets stretched. Fill a rect with it
        inside an SVG that has NO viewBox — user units then equal CSS pixels. -->
   <pattern id="noche-papel-pattern" patternUnits="userSpaceOnUse"
            width="195" height="54">
     <g transform="scale(.5)"><use href="#noche-papel-art"/></g>
   </pattern>
  </defs>

  <!-- vector/editorial use: one full-size tile -->
  <symbol id="noche-papel-tile" viewBox="0 0 390 108">
    <use href="#noche-papel-art"/>
  </symbol>

  <!-- ==========================================================================
       ENGRAVED CORNER ORNAMENT — top-left orientation; flip for other corners
       ======================================================================= -->
  <symbol id="noche-corner" viewBox="0 0 120 120">
    <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <!-- double rule -->
      <path d="M6,58 V16 A10,10 0 0 1 16,6 H58" stroke-width="2.2"/>
      <path d="M14,58 V20 A6,6 0 0 1 20,14 H58" stroke-width="1"/>
      <!-- interlocking scrolls -->
      <path d="M26,27 C45,25 60,37 62,55 C63,65 57,73 48,73 C40,73 34,67 34,59
               C34,52 39,47 46,47 C51,47 55,51 55,56" stroke-width="2"/>
      <path d="M27,26 C25,45 37,60 55,62 C65,63 73,57 73,48 C73,40 67,34 59,34
               C52,34 47,39 47,46 C47,51 51,55 56,55" stroke-width="1.4" opacity=".82"/>
      <!-- engraving ticks -->
      <path d="M36,53 l-6,6 M41,60 l-6,6 M48,64 l-6,6" stroke-width=".9" opacity=".7"/>
      <path d="M64,10 l0,7 M76,12 l-2,7 M10,64 l7,0 M12,76 l7,-2" stroke-width=".9" opacity=".55"/>
    </g>
    <!-- leaves + beads -->
    <path d="M62,55 C73,50 86,55 93,66 C81,68 68,64 62,55 Z"
          fill="currentColor" fill-opacity=".3" stroke="currentColor" stroke-width="1.2"/>
    <path d="M55,62 C50,73 55,86 66,93 C68,81 64,68 55,62 Z"
          fill="currentColor" fill-opacity=".3" stroke="currentColor" stroke-width="1.2"/>
    <path d="M10,10 l5,-5 l5,5 l-5,5 Z" fill="currentColor"/>
    <circle cx="58" cy="6" r="2" fill="currentColor"/>
    <circle cx="6" cy="58" r="2" fill="currentColor"/>
  </symbol>

  <!-- ==========================================================================
       CALAVERA — Posada-tradition skull. Features are cut through (evenodd),
       so it reads as a stencil against any background.
       ======================================================================= -->
  <symbol id="noche-calavera" viewBox="0 0 200 240">
    <path fill="currentColor" fill-rule="evenodd" d="
      M100,16 C60,16 32,44 32,84 C32,102 38,116 47,126 L47,141
      C47,149 52,155 60,158 C66,160 70,164 72,171 C75,183 84,193 100,193
      C116,193 125,183 128,171 C130,164 134,160 140,158 C148,155 153,149 153,141
      L153,126 C162,116 168,102 168,84 C168,44 140,16 100,16 Z
      M58,76 C58,61 70,52 82,57 C92,61 95,72 91,84 C87,96 74,101 65,97
      C58,94 58,86 58,76 Z
      M142,76 C142,61 130,52 118,57 C108,61 105,72 109,84 C113,96 126,101 135,97
      C142,94 142,86 142,76 Z
      M100,98 C96,109 89,118 89,126 C89,132 94,137 100,137 C106,137 111,132 111,126
      C111,118 104,109 100,98 Z
      M66,146 H134 A4,4 0 0 1 138,150 V166 A4,4 0 0 1 134,170 H66
      A4,4 0 0 1 62,166 V150 A4,4 0 0 1 66,146 Z"/>

    <!-- teeth -->
    <g fill="currentColor">
      <rect x="62" y="156.5" width="76" height="2.6"/>
      <rect x="74" y="146" width="2.6" height="24"/>
      <rect x="86" y="146" width="2.6" height="24"/>
      <rect x="98.7" y="146" width="2.6" height="24"/>
      <rect x="111" y="146" width="2.6" height="24"/>
      <rect x="123" y="146" width="2.6" height="24"/>
    </g>

    <!-- woodcut hatching on the temples -->
    <g stroke="currentColor" fill="none" stroke-linecap="round" opacity=".55">
      <path d="M37,70 l14,-7 M38,79 l15,-7 M40,88 l15,-7" stroke-width="1.5"/>
      <path d="M163,70 l-14,-7 M162,79 l-15,-7 M160,88 l-15,-7" stroke-width="1.5"/>
      <path d="M56,110 C63,117 63,126 56,132" stroke-width="1.6"/>
      <path d="M144,110 C137,117 137,126 144,132" stroke-width="1.6"/>
      <path d="M78,178 C88,183 112,183 122,178" stroke-width="1.4"/>
    </g>

    <!-- eye-socket beads, Posada-style -->
    <g fill="currentColor" opacity=".85">
      <circle cx="52" cy="63" r="2.2"/><circle cx="63" cy="49" r="2.2"/>
      <circle cx="78" cy="46" r="2.2"/><circle cx="93" cy="50" r="2.2"/>
      <circle cx="148" cy="63" r="2.2"/><circle cx="137" cy="49" r="2.2"/>
      <circle cx="122" cy="46" r="2.2"/><circle cx="107" cy="50" r="2.2"/>
      <circle cx="60" cy="104" r="2"/><circle cx="140" cy="104" r="2"/>
    </g>

    <!-- forehead marigold -->
    <g transform="translate(100,36) scale(.62)">
      <use href="#noche-marigold-core"/>
    </g>

    <!-- jaw flourish -->
    <g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" opacity=".7">
      <path d="M72,200 C82,208 96,210 100,220 C104,210 118,208 128,200"/>
      <path d="M100,220 C97,228 92,231 86,231 M100,220 C103,228 108,231 114,231"/>
      <path d="M86,231 C82,231 80,228 81,225 M114,231 C118,231 120,228 119,225"/>
    </g>
  </symbol>

  <!-- ==========================================================================
       AGAVE FLOURISH — rosette of blades, engraved
       ======================================================================= -->
  <symbol id="noche-agave" viewBox="0 0 240 132">
    <g transform="translate(120,126)">
      <use href="#noche-agave-blade" transform="rotate(-74) scale(.66)"/>
      <use href="#noche-agave-blade" transform="rotate(74) scale(.66)"/>
      <use href="#noche-agave-blade" transform="rotate(-56) scale(.82)"/>
      <use href="#noche-agave-blade" transform="rotate(56) scale(.82)"/>
      <use href="#noche-agave-blade" transform="rotate(-38) scale(.94)"/>
      <use href="#noche-agave-blade" transform="rotate(38) scale(.94)"/>
      <use href="#noche-agave-blade" transform="rotate(-19) scale(1.02)"/>
      <use href="#noche-agave-blade" transform="rotate(19) scale(1.02)"/>
      <use href="#noche-agave-blade" transform="rotate(0) scale(1.14)"/>
      <path d="M-34,2 C-16,-8 16,-8 34,2 Z" fill="currentColor" fill-opacity=".35"/>
      <path d="M-40,3 C-18,-9 18,-9 40,3" fill="none" stroke="currentColor" stroke-width="1.8"/>
    </g>
  </symbol>

  <!-- ==========================================================================
       MARIGOLD — standalone
       ======================================================================= -->
  <symbol id="noche-marigold" viewBox="0 0 48 48">
    <g transform="translate(24,24)"><use href="#noche-marigold-core"/></g>
  </symbol>

  <!-- ==========================================================================
       ENGRAVED DIVIDER — centre ornament for section rules
       ======================================================================= -->
  <symbol id="noche-divider-mark" viewBox="0 0 120 32">
    <g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
      <path d="M2,16 H34"/>
      <path d="M86,16 H118"/>
      <path d="M34,16 C40,16 42,10 48,10 C53,10 55,16 60,16 C65,16 67,10 72,10 C78,10 80,16 86,16"/>
      <path d="M34,16 C40,16 42,22 48,22 C53,22 55,16 60,16 C65,16 67,22 72,22 C78,22 80,16 86,16"/>
    </g>
    <path d="M60,9 L67,16 L60,23 L53,16 Z" fill="currentColor"/>
    <circle cx="34" cy="16" r="2" fill="currentColor"/>
    <circle cx="86" cy="16" r="2" fill="currentColor"/>
  </symbol>

</svg>
